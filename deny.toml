# Paytobe Rule 0: fail closed on licenses outside the project's permissive
# code-dependency allowlist. Do not add exceptions here without explicit owner
# approval and a corresponding legal-record update.
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
]

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
