        badge: 'Network pending',
        actions: [
          { label: 'Refresh status', action: 'manual-confirm', kind: 'primary' },
          { label: 'Simulate failure', action: 'manual-fail', kind: 'secondary' }
        ]
      },
      confirmed: {
        tone: 'safe',
        icon: 'check',
        title: 'Confirmed',
        copy: 'The transfer was confirmed on-chain and the balance history now includes the amount and fee.',
        badge: 'Final',
        actions: [
          { label: 'View activity', screen: 'activity', kind: 'primary' }
        ]
      },
      failed: {
        tone: 'danger',
        icon: 'alert',
        title: 'Broadcast failed',
        copy: 'The network did not accept the signed transaction. Review the same recipient and fee before retrying.',
        badge: 'Needs action',
        actions: [
          { label: 'Retry broadcast', action: 'manual-broadcast', kind: 'primary' },
          { label: 'Back to draft', action: 'manual-reset', kind: 'secondary' }
        ]
      }
    };
    return map[state.manualStatus] || map.review;
  }

  function renderManualStatusTracker() {
    const order = ['review', 'signed', 'broadcasting', 'confirmed', 'failed'];
    const labels = {
      review: 'Review',
      signed: 'Signed',
      broadcasting: 'Broadcast',
      confirmed: 'Confirmed',
      failed: 'Failed'
    };
    const current = order.indexOf(state.manualStatus);
    return '<div class="manual-status-grid">' + order.map((id, index) => {
      const cls = id === 'failed' && state.manualStatus === 'failed' ? ' failed' : index < current ? ' done' : id === state.manualStatus ? ' active' : '';
      return '<div class="manual-state' + cls + '"><strong>' + labels[id] + '</strong><span>' + (index + 1) + '</span></div>';
    }).join('') + '</div>';
  }

  function renderReceive() {
    const asset = selectedTransferAsset();
    const receiveAddress = assetAddress(asset);
    return [
      renderSubheader('Receive assets', 'Your wallet address', 'home'),
      '<section class="stack">',
      '<div class="qr-card"><div class="qr receive-qr" id="receiveQr"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-5)"><span style="font-weight:var(--weight-semibold)">Network</span><span class="code-box">' + asset.chain + '</span></div></div>',
      '<div class="address-card"><div class="eyebrow">Receive ' + asset.symbol + '</div><div class="copy-line" style="margin-top:var(--space-3)"><span class="address">' + escapeHtml(receiveAddress) + '</span><button class="round-btn" data-action="copy-address" aria-label="Copy receive address">' + icon('copy', 18) + '</button></div><p class="subtle" style="margin:var(--space-3) 0 0">Use this address only for ' + asset.symbol + ' on ' + asset.chain + '. Other networks show separate receive details.</p></div>',
      '</section>'
    ].join('');
  }

  function renderAssetSearch() {
    return [
      renderSubheader('Crypto assets', 'Search assets', 'home'),
      '<section class="stack">',
      '<label class="search-field">' + icon('search', 20) + '<input id="assetSearchInput" type="search" placeholder="Search token, chain, or asset" value="' + escapeHtml(state.assetQuery) + '" autocomplete="off" /></label>',
      '<div id="assetSearchResults" class="stack">' + renderAssetSearchResults() + '</div>',
      '</section>'
    ].join('');
  }

  function renderAssetSearchResults() {
    const query = state.assetQuery.trim().toLowerCase();
    const blockedQuery = /tron|trx|trc20/.test(query);
    const nearQuery = /\bnear\b|near protocol/.test(query);
    const list = assetCatalog.filter(asset => {
      const haystack = [asset.symbol, asset.name, asset.chain, asset.family, asset.standard, assetAddress(asset), asset.balance].join(' ').toLowerCase();
      return !query || haystack.includes(query);
    });
    const chips = [
      ['All', ''],
      ['XLM', 'xlm'],
      ['BTC', 'btc'],
      ['EVM', 'evm'],
      ['Base', 'base'],
      ['Not added', 'not added']
    ].map(([label, value]) => {
      const active = state.assetQuery.trim().toLowerCase() === value;
      return '<button class="search-chip ' + (active ? 'active' : '') + '" data-search-query="' + value + '" type="button">' + label + '</button>';
    }).join('');
    const clear = query ? '<button class="search-clear" data-clear-search type="button">Clear</button>' : '';
    const summary = '<div class="search-summary"><span>' + list.length + ' result' + (list.length === 1 ? '' : 's') + (query ? ' for "' + escapeHtml(state.assetQuery.trim()) + '"' : '') + '</span>' + clear + '</div>';
    if (blockedQuery) {
      return '<div class="search-chip-row">' + chips + '</div>' + summary + '<div class="risk danger">' + icon('alert', 22) + '<div><strong>TRON is blocked</strong><div style="font-size:var(--text-sm);margin-top:2px">VelarumPay does not support TRON, TRX, or TRC20 deposits, transfers, Payment Requests, or custom network enablement.</div></div></div>';
    }
    if (nearQuery) {
      return '<div class="search-chip-row">' + chips + '</div>' + summary + '<div class="risk caution">' + icon('info', 22) + '<div><strong>NEAR removed from v1</strong><div style="font-size:var(--text-sm);margin-top:2px">NEAR is not part of the required 30-asset real-transfer list for this prototype.</div></div></div>';
    }
    if (!list.length) {
      return '<div class="search-chip-row">' + chips + '</div>' + summary + '<div class="card" style="text-align:center"><span class="agent-mark" style="margin:0 auto var(--space-4)">' + icon('search', 22) + '</span><h2 class="title" style="font-size:var(--text-xl)">No asset found</h2><p class="subtle">Try a token symbol like BTC, XLM, SOL, ETH, DOGE, or a network like Base.</p></div>';
    }
    return '<div class="search-chip-row">' + chips + '</div>' + summary + '<div class="asset-list">' + list.map(asset => {
      return assetRow(asset);
    }).join('') + '</div>';
  }

  function assetRow(asset) {
    const holding = asset.balance === 'Not added' ? '<span>Available</span>' : '<strong>' + asset.balance + ' ' + asset.symbol + '</strong><span>Details</span>';
    return '<button class="asset-row" data-asset="' + assetKey(asset) + '"><span class="asset-mark" style="background:' + asset.color + '">' + asset.mark + '</span><span class="asset-copy"><span class="asset-title">' + asset.symbol + ' on ' + asset.chain + '</span><span class="asset-address">' + shortAddress(assetAddress(asset)) + '</span></span><span class="asset-balance">' + holding + '</span></button>';
  }

  function renderAssetDetail() {
    const asset = getAsset(state.asset);
    const added = asset.balance !== 'Not added';
    const fiat = added ? '&asymp; $' + formatUsd(assetFiatUsd(asset)) : 'Not in wallet yet';
    return [
      renderSubheader('Asset details', asset.symbol + ' on ' + asset.chain, 'home'),
      '<section class="stack">',
      '<div class="asset-detail-hero"><div class="asset-detail-head"><span class="asset-detail-mark" style="background:' + asset.color + '">' + asset.mark + '</span><span style="min-width:0"><span class="asset-detail-name">' + asset.name + '</span><span class="asset-detail-network">' + asset.chain + ' network</span></span></div><div class="asset-detail-amount">' + (added ? asset.balance : '0') + '<span class="balance-token" style="color:color-mix(in srgb, var(--text-on-brand) 84%, transparent)">' + asset.symbol + '</span></div><div class="balance-fiat">' + fiat + '</div><div class="asset-detail-actions"><button class="button white" data-screen="send">' + icon('send', 17) + 'Send</button><button class="button white" data-screen="receive">' + icon('receive', 17) + 'Receive</button></div></div>',
      '<div class="card">' + fact('Network', badge(asset.chain, 'safe')) + fact('Asset standard', asset.standard) + fact('Wallet address', '<span class="address">' + escapeHtml(assetAddress(asset)) + '</span>') + fact('Status', badge(added ? 'In wallet' : 'Available to add', added ? 'safe' : 'info')) + fact('Signing', 'Local approval required') + '</div>',
      '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">Real transfer checklist</div><div class="transfer-check-grid">' + ['Address derivation', 'Balance read', 'Fee quote', 'Local sign', 'Broadcast', 'Confirm'].map(label => '<span>' + icon('check', 14) + label + '</span>').join('') + '</div></div>',
      '<div class="risk info">' + icon('info', 22) + '<div><strong>' + asset.chain + ' adapter rule</strong><div style="font-size:var(--text-sm);margin-top:2px">' + chainRequirementCopy(asset) + '</div></div></div>',
      '<button class="request-card" data-asset-history type="button"><div class="request-top"><span class="section-title" style="font-size:var(--text-lg)">Recent activity</span><span style="display:flex;align-items:center;gap:var(--space-2)">' + badge('View all', 'info') + icon('arrowRight', 18) + '</span></div><div style="margin-top:var(--space-2)">' + (renderAssetActivityRows(asset, 1) || activityRow('No activity yet', 'Balance changes appear here after your first transfer.', '', 'info')) + '</div></button>',
      '</section>'
    ].join('');
  }

  function renderAssetHistory() {
    const asset = getAsset(state.asset);
    const added = asset.balance !== 'Not added';
    const rows = renderAssetActivityRows(asset);
    return [
      renderSubheader('Asset activity', asset.symbol + ' amount history', 'assetDetail'),
      '<section class="stack">',
      '<div class="card">' + fact('Token', asset.name + ' ' + badge(asset.chain, 'safe')) + fact('Current balance', added ? '<span class="mono">' + asset.balance + ' ' + asset.symbol + '</span>' : 'Not in wallet yet') + fact('History scope', 'All amount changes for this token and network') + '</div>',
      rows ? '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">All amount changes</div>' + rows + '</div>' : '<div class="card" style="text-align:center"><span class="agent-mark" style="margin:0 auto var(--space-4)">' + icon('clock', 22) + '</span><h2 class="title" style="font-size:var(--text-xl)">No amount changes yet</h2><p class="subtle">This asset is available, but no balance-changing activity has been recorded in the wallet.</p></div>',
      '<div class="risk info">' + icon('info', 22) + '<div><strong>History includes balance changes only</strong><div style="font-size:var(--text-sm);margin-top:2px">Risk reviews and blocked requests stay in Inbox unless they create or attempt an on-chain transaction.</div></div></div>',
      '</section>'
    ].join('');
  }

  function assetActivityData(asset) {
    const key = assetKey(asset);
    // A fresh wallet has no transaction history, so nothing is seeded here.
    // Only the status of the current in-session manual transfer is surfaced.
    const rows = [];
    if (key === 'usdc-base') {
      if (state.manualStatus === 'signed') {
        rows.unshift({ title: 'Manual transfer signed locally', sub: 'Not broadcast yet · no balance change', amount: '42.01 USDC', tone: 'info' });
      }
      if (state.manualStatus === 'broadcasting') {
        rows.unshift({ title: 'Manual transfer broadcasting', sub: 'Network pending · tx submitted', amount: '-42.01 USDC', tone: 'info' });
      }
      if (state.manualStatus === 'confirmed') {
        rows.unshift({ title: 'Manual transfer confirmed', sub: 'Amount and network fee settled', amount: '-42.01 USDC', tone: 'safe' });
      }
      if (state.manualStatus === 'failed') {
        rows.unshift({ title: 'Manual transfer failed', sub: 'Broadcast rejected · no balance change', amount: '0.00 USDC', tone: 'danger' });
      }
    }
    return rows;
  }

  function renderAssetActivityRows(asset, limit) {
    const rows = assetActivityData(asset);
    return rows.slice(0, limit || rows.length).map(row => activityRow(row.title, row.sub, row.amount, row.tone)).join('');
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }

  function renderSubheader(eyebrow, title, backScreen) {
    const back = backScreen ? '<button class="round-btn" data-back type="button" aria-label="Back">' + icon('arrowLeft', 21) + '</button>' : '';
    return '<div class="subheader">' + back + '<div class="subheader-title"><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1></div></div>';
  }

  function renderInbox() {
    const all = REQUEST_ORDER.map(getRequest);
    const list = all.filter(req => {
      if (state.filter === 'pending') return ['blocked', 'missing', 'pending', 'broadcasting', 'failed', 'network_disabled'].includes(req.status);
      if (state.filter === 'final') return ['expired', 'confirmed', 'rejected'].includes(req.status);
      return true;
    });
    return [
      renderSubheader('Inbox', 'Requests to review'),
      '<div class="segmented" style="margin-bottom:var(--space-5)"><button class="segment ' + (state.filter === 'pending' ? 'active' : '') + '" data-filter="pending">Pending</button><button class="segment ' + (state.filter === 'all' ? 'active' : '') + '" data-filter="all">All</button><button class="segment ' + (state.filter === 'final' ? 'active' : '') + '" data-filter="final">Final</button></div>',
      '<section class="stack">',
      list.length
        ? list.map(requestCard).join('')
        : '<div class="card" style="text-align:center;padding:var(--space-8) var(--space-5)"><span class="agent-mark" style="margin:0 auto var(--space-4)">' + icon('zap', 24) + '</span><h2 class="title" style="font-size:var(--text-xl)">No payment requests</h2><p class="subtle">When a connected agent or app requests a payment, it appears here for you to review and sign.</p></div>',
      '</section>'
    ].join('');
  }

  function requestCard(req) {
    const disabled = ['expired', 'confirmed', 'rejected'].includes(req.status);
    return '<button class="request-card ' + (req.risk === 'danger' ? 'danger' : '') + '" data-detail="' + req.id + '"><div class="request-top">' + agentBlock(req) + badge(req.label, req.risk) + '</div><div class="request-title">' + req.title + '</div><div class="request-meta">' + req.amount + ' ' + req.token + ' to ' + req.payee + ' · ' + req.network + '</div><div class="request-foot">' + badge(req.riskLabel, req.risk) + badge('Context: ' + req.context, req.risk === 'danger' ? 'danger' : req.status === 'missing' ? 'caution' : 'info') + '<span class="section-note" style="margin-left:auto">' + req.window + '</span></div></button>';
  }

  function renderDetail() {
    const req = getRequest(state.detail);
    const meta = requestStateMeta(req);
    return [
      renderSubheader('Payment Request', 'Review payment', 'inbox'),
      '<section class="stack">',
      '<div class="request-top" style="padding:0 2px">' + agentBlock(req) + badge(req.label, req.risk) + '</div>',
      '<div class="card" style="text-align:center"><div class="subtle">You are paying</div><div class="balance-value" style="color:var(--text-strong);font-size:46px;justify-content:center;min-height:60px">' + req.amount + '<span class="balance-token" style="color:var(--text-muted)">' + req.token + '</span></div><div class="balance-fiat" style="color:var(--text-muted)">&asymp; ' + req.fiat + '</div></div>',
      '<div class="card">' + fact('Payee', req.payee) + fact('Recipient', '<span class="address">' + shortAddress(req.recipient) + '</span>') + fact('Network', badge(req.network, 'safe')) + fact('Network fee', '<span class="mono">' + req.fee + '</span>') + fact('Total', '<span class="mono">' + req.total + ' ' + req.token + '</span>') + '</div>',
      '<div class="risk ' + meta.tone + '">' + icon(meta.icon, 22) + '<div><strong>' + meta.title + '</strong><div style="font-size:var(--text-sm);margin-top:2px">' + meta.copy + '</div></div></div>',
      renderTruthPanel(req),
      renderTransactionStatePanel(req),
      renderDossierEntry(req),
      !isRequestSignable(req) ? renderStateActions(meta.actions) : '',
      '</section>'
    ].join('');
  }

  function fact(label, value) {
    return '<div class="fact-row"><span class="fact-label">' + label + '</span><span class="fact-value">' + value + '</span></div>';
  }

  function requestStateMeta(req) {
    if (req.status === 'pending' && req.risk === 'safe' && !state.backupSaved) {
      return {
        tone: 'caution',
        icon: 'alert',
        title: 'Backup required before signing',
        copy: 'Verify the 24-word recovery phrase backup before the encrypted keyring can create any local signature.',
        badge: 'Backup gate',
        actions: [
          { label: 'Back up now', screen: 'keyBackup', kind: 'primary' },
          { label: 'Reject request', action: 'reject', kind: 'secondary' }
        ]
      };
    }
    if (req.status === 'pending' && req.risk === 'caution') {
      return {
        tone: 'caution',
        icon: 'info',
        title: 'Source review required',
        copy: 'Some critical context is AI-only or observed-only. Review the source groups before signing.',
        badge: 'Warning',
        actions: [
          { label: 'Open dossier', screen: 'dossier', kind: 'primary' },
          { label: 'Request context', action: 'request-context', kind: 'secondary' }
        ]
      };
    }
    const map = {
      pending: {
        tone: 'safe',
        icon: 'shield',
        title: 'Ready to sign',
        copy: 'Recipient is verified and the amount is within the granted daily limit.',
        badge: 'Awaiting signature',
        actions: []
      },
      missing: {
        tone: 'caution',
        icon: 'info',
        title: 'Paused: missing context',
        copy: 'Required evidence is missing. The wallet can show payment facts, but signing stays unavailable until context is repaired.',
        badge: 'Paused',
        actions: [
          { label: 'Request context', action: 'request-context', kind: 'primary' },
          { label: 'Reject request', action: 'reject', kind: 'secondary' }
        ]
      },
      blocked: {
        tone: 'danger',
        icon: 'alert',
        title: 'Blocked by risk policy',
        copy: 'The verified payee does not match the on-chain recipient. No signature can be created for this request.',
        badge: 'Blocked',
        actions: [
          { label: 'Open dossier', screen: 'dossier', kind: 'primary' },
          { label: 'Reject request', action: 'reject', kind: 'secondary' }
        ]
      },
      expired: {
        tone: 'info',
        icon: 'clock',
        title: 'Expired',
        copy: 'The approval window closed. Nothing was signed and no transaction was broadcast.',
        badge: 'Final',
        actions: [
          { label: 'Archive', action: 'archive-request', kind: 'secondary' }
        ]
      },
      broadcasting: {
        tone: 'info',
        icon: 'clock',
        title: 'Broadcasting',
        copy: 'A local signature exists and the transaction hash has been submitted. Wait for network confirmation or refresh status.',
        badge: 'Network pending',
        actions: [
          { label: 'Refresh status', action: 'refresh-status', kind: 'primary' },
          { label: 'View activity', screen: 'activity', kind: 'secondary' }
        ]
      },
      signed_locally: {
        tone: 'info',
        icon: 'key',
        title: 'Signed locally',
        copy: 'The exact transaction was signed on this device. Broadcast or activity tracking can continue, but signing cannot run again.',
        badge: 'Local',
        actions: [
          { label: 'Broadcast transaction', action: 'retry-broadcast', kind: 'primary' },
          { label: 'View activity', screen: 'activity', kind: 'secondary' }
        ]
      },
      failed: {
        tone: 'danger',
        icon: 'alert',
        title: 'Broadcast failed',
        copy: 'The request was signed, but the network did not accept the transaction. Retry only after reviewing the fee and recipient again.',
        badge: 'Needs action',
        actions: [
          { label: 'Retry broadcast', action: 'retry-broadcast', kind: 'primary' },
          { label: 'Replace request', action: 'replace-request', kind: 'secondary' }
        ]
      },
      network_disabled: {
        tone: 'caution',
        icon: 'globe',
        title: 'Network disabled',
        copy: 'This request targets a network that is not enabled in the wallet. Enable and verify the network before signing is possible.',
        badge: 'Unavailable',
        actions: [
          { label: 'Enable network', action: 'open-network-warning', kind: 'primary' },
          { label: 'Reject request', action: 'reject', kind: 'secondary' }
        ]
      },
      confirmed: {
        tone: 'safe',
        icon: 'check',
        title: 'Confirmed',
        copy: 'The transaction is confirmed on-chain and recorded in activity history. No new signature is allowed.',
        badge: 'Final',
        actions: [
          { label: 'View activity', screen: 'activity', kind: 'primary' }
        ]
      },
      rejected: {
        tone: 'danger',
        icon: 'x',
        title: 'Rejected',
        copy: 'You rejected this Payment Request. Nothing was signed and agents cannot reuse this approval.',
        badge: 'Final',
        actions: [
          { label: 'Back to Inbox', screen: 'inbox', kind: 'secondary' }
        ]
      },
      cancelled: {
        tone: 'info',
        icon: 'x',
        title: 'Cancelled',
        copy: 'The requesting app cancelled this Payment Request. Nothing was signed and the approval cannot be reused.',
        badge: 'Final',
        actions: [
          { label: 'Back to Inbox', screen: 'inbox', kind: 'secondary' }
        ]
      }
    };
    return map[req.status] || map.pending;
  }

  function defaultTruth(req) {
    const missing = req.status === 'missing' || !req.items.length;
    const danger = req.risk === 'danger';
    return {
      verified: [
        { field: 'Payment amount', value: req.amount + ' ' + req.token, source: 'Payment fact', status: 'payment_request_fact', evidence: 'Parsed from Payment Request', tone: 'safe' },
        { field: 'Network and fee', value: req.network + ' · ' + req.fee, source: 'Wallet derived', status: 'wallet derived', evidence: 'Wallet transaction preview', tone: 'safe' }
      ],
      merchantClaims: missing ? [] : [
        { field: 'Payee', value: req.payee, source: danger ? 'Merchant profile' : 'Merchant profile', status: danger ? 'conflicted' : 'domain verified', evidence: danger ? 'Profile conflicts with recipient' : 'Merchant profile attached', tone: danger ? 'danger' : 'safe' },
        { field: 'Items', value: req.items.length + ' item(s)', source: 'Website observed', status: 'observed only', evidence: 'Itemized context attached', tone: 'info' }
      ],
      merchantAi: [],
      userAi: [
        { field: 'User intent', value: req.intent, source: 'You provided', status: 'user intent', evidence: req.agent + ' task summary', tone: 'info' }
      ],
      missing: missing ? [
        { field: 'Transaction context', value: 'Incomplete', source: 'Missing', status: 'missing', evidence: 'Item evidence, source page, or quote unavailable', tone: 'danger' }
      ] : danger ? [
        { field: 'Recipient match', value: 'Conflicted', source: 'Velarum verified', status: 'conflicted', evidence: 'Payee profile does not match recipient address', tone: 'danger' }
      ] : []
    };
  }

  function renderTruthPanel(req) {
    const truth = req.truth || defaultTruth(req);
    const sections = [
      ['Verified facts', 'payment and verified proof', truth.verified, 'safe', 'shield'],
      ['Merchant claims', 'website or API statements', truth.merchantClaims, 'info', 'store'],
      ['Merchant AI claims', 'not signed terms', truth.merchantAi, 'caution', 'bot'],
      ['Your AI interpretation', 'agent reasoning only', truth.userAi, 'info', 'bot'],
      ['Missing or risky', 'needs correction or acceptance', truth.missing, truth.missing && truth.missing.some(row => row.tone === 'danger') ? 'danger' : 'caution', 'alert']
    ].filter(section => section[2] && section[2].length);
    return '<div class="card"><div class="section-head"><span class="section-title">Truth Panel</span><span class="section-note">facts, claims, inference</span></div><div class="truth-panel">' + sections.map(section => renderTruthSection(section[0], section[1], section[2], section[3], section[4])).join('') + '</div></div>';
  }

  function renderTruthSection(title, note, rows, tone, iconName) {
    return '<div class="truth-section ' + tone + '"><div class="truth-head"><span class="truth-title">' + icon(iconName, 18) + title + '</span><span class="truth-note">' + note + '</span></div>' + rows.map(renderTruthRow).join('') + '</div>';
  }

  function renderTruthRow(row) {
    const tone = row.tone || 'info';
    return '<div class="truth-row"><div class="truth-row-main"><span class="truth-field">' + escapeHtml(row.field) + '</span><span class="truth-value">' + escapeHtml(row.value) + '</span></div><div class="truth-meta">' + badge(row.source, tone) + badge(row.status, tone) + '</div><div class="truth-evidence">' + escapeHtml(row.evidence) + '</div></div>';
  }

  function renderStateActions(actions) {
    if (!actions.length) return '';
    const cols = Math.min(actions.length, 2);
    return '<div class="state-actions" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' + actions.map(action => {
      const cls = action.kind === 'primary' ? 'pill full' : 'button secondary full';
      const attr = action.screen ? 'data-screen="' + action.screen + '"' : 'data-action="' + action.action + '"';
      return '<button class="' + cls + '" ' + attr + '>' + action.label + (action.kind === 'primary' ? ' ' + icon('arrowRight', 18) : '') + '</button>';
    }).join('') + '</div>';
  }

  function renderTransactionStatePanel(req) {
    if (isRequestSignable(req)) return '';
    const meta = requestStateMeta(req);

  function handleScannedQrPayload(rawValue) {
    const raw = String(rawValue || '').trim();
    const result = classifyScannedQr(raw);
    state.scanResult = result;
    if (result.type === 'payment') {
      state.scanPayment = result.payment;
      state.scanTransferStatus = 'detected';
      setScreen('scanTransfer');
      showToast('Payment QR detected', 'Review amount, recipient, network, fee, and total before signing.');
      return;
    }
    state.scanPayment = null;
    if (result.type === 'address') {
      state.scanTransferStatus = 'address';
      setScreen('scanTransfer');
      showToast('Address detected', 'Choose asset and amount before signing.');
      return;
    }
    if (result.type === 'pairing') {
      state.scanTransferStatus = 'pairing';
      setScreen('scanTransfer');
      showToast('Pairing QR detected', 'Review identity and scopes before approving.');
      return;
    }
    if (result.type === 'setup') {
      state.scanTransferStatus = 'setup';
      setScreen('scanTransfer');
      showToast('Relay setup detected', 'Review endpoint before saving.');
      return;
    }
    if (result.type === 'external') {
      state.scanTransferStatus = 'external';
      setScreen('scanTransfer');
      showToast(result.danger ? 'Risky QR blocked' : 'External link detected', result.reason, result.danger);
      return;
    }
    state.scanTransferStatus = 'invalid';
    setScreen('scanTransfer');
    showToast('Unsupported QR', 'No wallet action was created from this code.', true);
  }

  function classifyScannedQr(raw) {
    if (!raw) return { type: 'invalid', raw: '', reason: 'Empty QR payload' };
    const lower = raw.toLowerCase();
    if (/^(tron|trx|trc20):/i.test(raw) || isTronRecipient(raw) || /(?:asset|token|network|chain)=tr(on|x|c20)/i.test(raw)) {
      return {
        type: 'external',
        raw,
        danger: true,
        reason: 'TRON, TRX, and TRC20 QR codes are blocked and cannot create a VelarumPay transfer.'
      };
    }
    const uri = parseUrl(raw);
    if (uri && uri.protocol === 'velarumpay:' && (uri.hostname === 'pay' || uri.pathname === '/pay')) {
      return paymentResult(raw, uri);
    }
    if (uri && uri.protocol === 'velarumpay:' && (uri.hostname === 'pair' || uri.pathname === '/pair')) {
      return {
        type: 'pairing',
        raw,
        agent: paramFromUrl(uri, 'agent') || 'Unknown agent',
        session: paramFromUrl(uri, 'session') || paramFromUrl(uri, 'pairing_session_id') || '',
        code: paramFromUrl(uri, 'code') || paramFromUrl(uri, 'pairing_code') || ''
      };
    }
    if (uri && (uri.protocol === 'agentwallet:' || uri.protocol === 'velarumpay:') && (uri.hostname === 'setup' || uri.pathname === '/setup')) {
      return {
        type: 'setup',
        raw,
        relayUrl: paramFromUrl(uri, 'relay_url') || paramFromUrl(uri, 'relay') || '',
        deviceId: paramFromUrl(uri, 'device_id') || ''
      };
    }
    if (uri && uri.protocol === 'ethereum:') {
      const address = uri.pathname || uri.hostname || raw.replace(/^ethereum:/i, '').split(/[?@/]/)[0];
      const amount = paramFromUrl(uri, 'amount') || paramFromUrl(uri, 'value_decimal');
      if (amount) return paymentResult(raw, uri, { recipient: address, network: chainName(paramFromUrl(uri, 'chain_id') || paramFromUrl(uri, 'chainId') || '1'), token: 'ETH', payee: 'Ethereum payment QR' });
      return { type: 'address', raw, address, network: chainName(paramFromUrl(uri, 'chain_id') || paramFromUrl(uri, 'chainId') || '1') };
    }
    if (uri && (uri.protocol === 'stellar:' || uri.protocol === 'web+stellar:')) {
      const address = paramFromUrl(uri, 'destination') || paramFromUrl(uri, 'to') || '';
      const amount = paramFromUrl(uri, 'amount');
      if (amount) return paymentResult(raw, uri, { recipient: address, network: 'Stellar', token: paramFromUrl(uri, 'asset') || 'XLM', payee: 'Stellar payment QR' });
      return { type: 'address', raw, address, network: 'Stellar' };
    }
    if (uri && uri.protocol === 'solana:') {
      const address = uri.pathname || uri.hostname || '';
      const amount = paramFromUrl(uri, 'amount');
      if (amount) return paymentResult(raw, uri, { recipient: address, network: 'Solana', token: paramFromUrl(uri, 'asset') || 'SOL', payee: 'Solana payment QR' });
      return { type: 'address', raw, address, network: 'Solana' };
    }
    if (/^0x[a-f0-9]{40}$/i.test(raw)) return { type: 'address', raw, address: raw, network: 'EVM address' };
    if (/^G[A-Z2-7]{55}$/.test(raw)) return { type: 'address', raw, address: raw, network: 'Stellar' };
    if (uri && (uri.protocol === 'http:' || uri.protocol === 'https:')) {
      const trusted = uri.hostname.endsWith('.velarumpay.com');
      if (trusted && uri.pathname === '/setup') {
        return { type: 'setup', raw, relayUrl: paramFromUrl(uri, 'relay_url') || '', deviceId: paramFromUrl(uri, 'device_id') || '' };
      }
      const looksLikePayment = lower.includes('to=') || lower.includes('recipient=') || lower.includes('amount=');
      return {
        type: 'external',
        raw,
        danger: !trusted || looksLikePayment,
        reason: looksLikePayment ? 'External web payment links cannot request wallet signing directly.' : 'Open external links only if you trust the source.'
      };
    }
    if (/^[0-9]{6}$/.test(raw)) return { type: 'pairing', raw, agent: 'Local agent', session: '', code: raw };
    return { type: 'invalid', raw, reason: 'Unsupported QR format' };
  }

  function paymentResult(raw, uri, fallback = {}) {
    const amount = paramFromUrl(uri, 'amount') || paramFromUrl(uri, 'value_decimal') || scanTransfer.amount;
    const token = paramFromUrl(uri, 'asset') || paramFromUrl(uri, 'token') || paramFromUrl(uri, 'symbol') || fallback.token || scanTransfer.token;
    const network = paramFromUrl(uri, 'network') || paramFromUrl(uri, 'chain') || fallback.network || scanTransfer.network;
    const recipient = paramFromUrl(uri, 'to') || paramFromUrl(uri, 'address') || paramFromUrl(uri, 'recipient') || paramFromUrl(uri, 'destination') || fallback.recipient || scanTransfer.recipient;
    const payee = paramFromUrl(uri, 'payee') || paramFromUrl(uri, 'merchant') || fallback.payee || scanTransfer.payee;
    const fee = network.toLowerCase().includes('stellar') ? '0.00001 ' + token : token === 'ETH' ? '0.0008 ETH' : scanTransfer.fee;
    return {
      type: 'payment',
      raw,
      payment: {
        payee,
        source: 'Scanned QR · ' + network,
        amount,
        token,
        network,
        fee,
        total: totalForScan(amount, token, fee),
        recipient,
        memo: paramFromUrl(uri, 'memo') || paramFromUrl(uri, 'label') || 'Scanned QR payment',
        txHash: '0x42bd...scan'
      }
    };
  }

  function totalForScan(amount, token, fee) {
    const n = Number(amount);
    const feeValue = Number(String(fee).split(' ')[0]);
    if (!Number.isFinite(n) || !Number.isFinite(feeValue) || !fee.includes(token)) return amount + ' ' + token;
    return (n + feeValue).toFixed(token === 'USDC' ? 2 : 5) + ' ' + token;
  }

  function parseUrl(raw) {
    try {
      return new URL(raw);
    } catch (_) {
      try {
        return new URL(raw.replace(/^ethereum:/i, 'ethereum://').replace(/^solana:/i, 'solana://'));
      } catch (__) {
        return null;
      }
    }
  }

  function paramFromUrl(uri, key) {
    if (!uri) return '';
    return uri.searchParams.get(key) || '';
  }

  function chainName(id) {
    const value = String(id || '').toLowerCase();
    if (value === '8453' || value === 'base') return 'Base';
    if (value === '1' || value === 'ethereum') return 'Ethereum';
    if (value === '137' || value === 'polygon') return 'Polygon';
    return value ? 'Chain ' + value : 'EVM';
  }

  function scanTransferMeta() {
    if (state.scanTransferStatus === 'detected' && !state.backupSaved) {
      return {
        tone: 'caution',
        icon: 'alert',
        title: 'Backup required before signing',

        copy: 'The QR created a payment draft only. Verify the 24-word backup before the scanned payment can be signed.',
        badge: 'Backup gate',
        tx: false,
        actions: [
          { label: 'Cancel', action: 'scan-cancel', kind: 'secondary' },
          { label: 'Back up now', screen: 'keyBackup', kind: 'primary' }
        ]
      };
    }
    const map = {
      detected: {
        tone: 'safe',
        icon: 'shield',
        title: 'Review QR payment',
        panelTitle: 'Ready for local approval',
        copy: 'The QR code produced a payment draft only. Confirm the recipient, network, fee, and total before signing.',
        badge: 'QR detected',
        tx: false,
        actions: [
          { label: 'Cancel', action: 'scan-cancel', kind: 'secondary' },
          { label: 'Sign locally', action: 'scan-sign', kind: 'primary' }
        ]
      },
      signed: {
        tone: 'info',
        icon: 'key',
        title: 'Signed locally',
        panelTitle: 'Signature ready',
        copy: 'The encrypted keyring was unlocked on this device. The signed transaction is ready to broadcast.',
        badge: 'Local',
        tx: true,
        actions: [
          { label: 'Broadcast', action: 'scan-broadcast', kind: 'primary' },
          { label: 'Scan again', action: 'scan-reset', kind: 'secondary' }

      },
      broadcasting: {
        tone: 'info',
        icon: 'clock',
        title: 'Broadcasting',
        panelTitle: 'Waiting for network',
        copy: 'The signed transaction was submitted and is waiting for confirmation.',
        badge: 'Pending',
        tx: true,
        actions: [
          { label: 'Refresh status', action: 'scan-confirm', kind: 'primary' },
          { label: 'Simulate failure', action: 'scan-fail', kind: 'secondary' }
        ]
      },
      confirmed: {
        tone: 'safe',
        icon: 'check',
        title: 'Transfer confirmed',
        panelTitle: 'Final on-chain record',
        copy: 'The scanned payment is confirmed and appears in activity history.',
        badge: 'Final',
        tx: true,
        actions: [
          { label: 'View activity', screen: 'activity', kind: 'primary' },
          { label: 'Scan again', action: 'scan-reset', kind: 'secondary' }

      failed: {
        tone: 'danger',
        icon: 'alert',
        title: 'Broadcast failed',
        panelTitle: 'Needs review',
        copy: 'The network rejected the submitted transaction. Review the same QR facts before retrying.',
        badge: 'Failed',

          { label: 'Retry broadcast', action: 'scan-broadcast', kind: 'primary' },
          { label: 'Scan again', action: 'scan-reset', kind: 'secondary' }

  function renderPairing() {
    if (state.pairingMode === 'request') {

        '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-3)">Requested scopes</div>' + permissionStatic('zap', 'payment.requests.create', 'Create payment requests for review.', 'grantable') + permissionStatic('clock', 'payment.requests.read', 'Read only its own request status.', 'grantable') + permissionStatic('eye', 'wallet.balances.read', 'Optional read-only balance view.', 'optional') + permissionStatic('key', 'wallet.sign', 'Never grantable from pairing.', 'blocked') + '</div>',
        '<div class="state-actions" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="button secondary full" data-action="reject-pairing">Reject</button><button class="pill full" data-action="approve-pairing">Approve ' + icon('arrowRight', 18) + '</button></div>',

        '<div class="card">' + fact('Daily request limit', '<span class="mono">50 USDC / day</span>') + fact('Signing permission', badge('Never granted', 'safe')) + fact('Connection', badge('Active', 'safe')) + '</div>',
        '<div class="state-actions" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="button secondary full" data-screen="agents">Done</button><button class="pill full" data-agent="agentfood">View agent ' + icon('arrowRight', 18) + '</button></div>',

        '<section class="stack">',
        '<div class="risk danger">' + icon('x', 22) + '<div><strong>No capability granted</strong><div style="font-size:var(--text-sm);margin-top:2px">The pairing request was rejected. This agent cannot create requests or read wallet data.</div></div></div>',
        '<div class="card">' + fact('Connection', badge('Not created', 'danger')) + fact('Scopes', badge('None', 'safe')) + '</div>',

      '<section class="scan-screen">',

      '<div class="scanner-card transfer" aria-label="Agent pairing QR scanner"><div class="scanner-frame"><span class="scanner-corner tl"></span><span class="scanner-corner tr"></span><span class="scanner-corner bl"></span><span class="scanner-corner br"></span></div><div class="scanner-copy"><strong>Scan agent pairing QR</strong><span>Connect a trusted local agent after reviewing identity, request scope, and daily limits.</span></div><button class="pill full" data-action="pairing-request" type="button">' + icon('scan', 18) + 'Start pairing</button><button class="button secondary full" data-screen="agents" type="button">Connected agents</button></div>',

  function permissionStatic(i, title, desc, scope) {
    return '<div class="switch-row"><span class="switch-icon">' + icon(i, 20) + '</span><span style="flex:1;min-width:0"><strong style="display:block;color:var(--text-strong)">' + title + '</strong><span class="subtle" style="font-size:var(--text-sm)">' + desc + '</span><span class="badge neutral" style="margin-top:var(--space-2)">' + scope + '</span></span></div>';
  }

  function renderProfile() {
    return [
      renderSubheader('Personal center', 'Profile'),
      '<section class="stack">',
      '<button class="identity-hero" data-screen="walletIdentity"><div class="request-top"><div class="identity-preview"><span class="identity-avatar">' + state.avatarInitial + '</span><span class="agent-copy"><span class="agent-name">' + state.walletName + '</span><span class="agent-sub">' + state.walletId + '</span></span></div><span style="display:flex;align-items:center;gap:var(--space-2)">' + badge('Wallet ID', 'safe') + icon('arrowRight', 19) + '</span></div><p class="subtle" style="margin:var(--space-4) 0 0">Set your wallet ID, avatar, and display name.</p></button>',
      '<button class="request-card" data-screen="agents"><div class="request-top"><span style="display:flex;align-items:center;gap:var(--space-3);font-weight:var(--weight-semibold);color:var(--text-strong)">' + icon('shield', 20) + 'Connected agents</span><span style="display:flex;align-items:center;gap:var(--space-2)">' + badge(Object.keys(agents).length + ' agents', 'safe') + icon('arrowRight', 19) + '</span></div><p class="subtle" style="margin:var(--space-3) 0 0">Manage agent permissions, limits, and revocation.</p></button>',
      '<button class="request-card" data-screen="activity"><div class="request-top"><span style="display:flex;align-items:center;gap:var(--space-3);font-weight:var(--weight-semibold);color:var(--text-strong)">' + icon('clock', 20) + 'Activity history</span>' + icon('arrowRight', 19) + '</div><p class="subtle" style="margin:var(--space-3) 0 0">All balance changes, signatures, broadcasts, blocked requests, and expired records.</p></button>',

    if (state.walletIdentityMode === 'walletId') return renderIdentityEditWalletId();
    if (state.walletIdentityMode === 'avatar') return renderIdentityEditAvatar();
    if (state.walletIdentityMode === 'saved') return renderIdentitySaved();
    return [
      renderSubheader('Profile', 'Wallet identity', 'profile'),
      '<section class="stack">',
      '<div class="card" style="text-align:center;padding:var(--space-8) var(--space-5)"><span class="identity-avatar" style="width:86px;height:86px;margin:0 auto var(--space-4);font-size:var(--text-2xl)">' + state.avatarInitial + '</span><h2 class="title" style="font-size:var(--text-xl)">' + state.walletName + '</h2><p class="subtle" style="margin:var(--space-2) 0 0">' + state.walletId + '</p></div>',
      '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">Basic wallet profile</div><div class="identity-row"><span style="display:flex;align-items:center;gap:var(--space-3)">' + icon('user', 20) + '<span><strong style="display:block;color:var(--text-strong)">Nickname</strong><span class="subtle" style="font-size:var(--text-sm)">' + state.walletName + '</span></span></span><button class="round-btn" data-action="edit-nickname" aria-label="Edit nickname">' + icon('pencil', 17) + '</button></div><div class="identity-row"><span style="display:flex;align-items:center;gap:var(--space-3)">' + icon('wallet', 20) + '<span><strong style="display:block;color:var(--text-strong)">Wallet ID</strong><span class="subtle" style="font-size:var(--text-sm)">' + state.walletId + '</span></span></span><button class="round-btn" data-action="edit-wallet-id" aria-label="Edit wallet ID">' + icon('pencil', 17) + '</button></div><div class="identity-row"><span style="display:flex;align-items:center;gap:var(--space-3)">' + icon('image', 20) + '<span><strong style="display:block;color:var(--text-strong)">Avatar</strong><span class="subtle" style="font-size:var(--text-sm)">Initial avatar · ' + state.avatarInitial + '</span></span></span><button class="round-btn" data-action="edit-avatar" aria-label="Edit avatar">' + icon('pencil', 17) + '</button></div></div>',
      '<div class="risk info">' + icon('info', 22) + '<div><strong>Public profile only</strong><div style="font-size:var(--text-sm);margin-top:2px">These fields help you recognize this wallet. They do not expose your private key or signing device.</div></div></div>',

    ].join('');

      '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">' + agent.name + ' capabilities</div>' + switchRow('request', 'zap', 'Request payments', 'Always requires your local signature') + switchRow('balances', 'eye', 'View balances', 'Read-only access to your asset list') + switchRow('merchants', 'store', 'Save merchants', 'Remember verified recipients') + switchRow('recurring', 'key', 'Sign on your behalf', 'Never available by design', true) + '</div>',

    const on = state.prefs[key] && !disabled;
    return '<div class="switch-row"><span class="switch-icon">' + icon(i, 20) + '</span><span style="flex:1;min-width:0"><strong style="display:block;color:var(--text-strong)">' + title + '</strong><span class="subtle" style="font-size:var(--text-sm)">' + desc + '</span></span><button class="switch ' + (on ? 'on' : '') + '" data-pref="' + key + '" ' + (disabled ? 'disabled' : '') + ' aria-label="' + title + '"></button></div>';

        renderSubheader('Security', 'Verify phrase', 'keyBackup'),
        '<section class="stack">',
        '<div class="risk caution">' + icon('info', 22) + '<div><strong>Confirm offline backup</strong><div style="font-size:var(--text-sm);margin-top:2px">Choose the requested words in order. The full phrase is no longer displayed.</div></div></div>',
        '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-3)">Word-order check</div><div class="method-grid"><button class="method-chip"><strong>08 velvet</strong><span>Selected</span></button><button class="method-chip"><strong>13 garden</strong><span>Selected</span></button><button class="method-chip"><strong>21 minute</strong><span>Selected</span></button></div><div style="margin-top:var(--space-4)">' + fact('Attempts', '2 remaining') + fact('Plaintext storage', badge('None', 'safe')) + '</div></div>',

        '<div class="state-actions" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="button secondary full" data-screen="keyBackup">Backup check</button><button class="pill full" data-screen="home">View wallet ' + icon('arrowRight', 18) + '</button></div>',
        '</section>'
      ].join('');

    return [
      renderSubheader('Security', 'Import or recover', 'security'),
      '<section class="stack">',
      '<div class="method-grid"><button class="method-chip" data-action="validate-import">' + icon('file', 20) + '<strong>Recovery phrase</strong><span>12/15/18/21/24 words</span></button><button class="method-chip" data-action="key-import-private">' + icon('key', 20) + '<strong>Private key</strong><span>Single account</span></button><div class="method-chip">' + icon('wallet', 20) + '<strong>Hardware wallet</strong><span>Future advanced path</span></div><div class="method-chip full">' + icon('eye', 20) + '<strong>Watch-only address</strong><span>No signing authority, viewing only</span></div><div class="method-chip disabled">' + icon('cloud', 20) + '<strong>Cloud backup</strong><span>Not enabled in v1</span></div><div class="method-chip disabled">' + icon('users', 20) + '<strong>MPC recovery</strong><span>Not enabled in v1</span></div></div>',

  function renderDeviceRisk() {

        '<section class="stack">',
        '<div class="risk danger">' + icon('alert', 22) + '<div><strong>Risk signals detected</strong><div style="font-size:var(--text-sm);margin-top:2px">Hook or repackaging signals reduce sensitive wallet capabilities until the device is trusted again.</div></div></div>',

  function networkInputField(key, label, placeholder, options) {
    const opts = options || {};
    const id = 'networkField' + key.charAt(0).toUpperCase() + key.slice(1);
    const value = escapeHtml(state.networkDraft[key] || '');
    const affix = opts.affix ? '<button class="network-affix" data-action="noop" type="button" aria-label="' + label + ' options">' + icon('chevronDown', 19) + '</button>' : '';
    return '<div class="add-network-field"><label class="add-network-label" for="' + id + '">' + label + '</label><div class="network-input-shell ' + (opts.affix ? 'with-affix' : '') + '"><input id="' + id + '" class="network-input ' + (opts.mono ? 'mono' : '') + '" data-network-field="' + key + '" type="text" inputmode="' + (opts.inputMode || 'text') + '" autocomplete="off" spellcheck="false" value="' + value + '" placeholder="' + placeholder + '" />' + affix + '</div></div>';
  }

  function networkStatusBlock(verified, complete) {
    const fromRequest = state.networkDraftSource === 'payment_request_prompt';
    const title = verified ? 'RPC endpoint verified' : complete ? 'RPC not verified yet' : 'Network details required';
    const copy = verified
      ? 'The endpoint responded with Chain ID ' + escapeHtml(state.networkDraft.chainId || '84532') + '. Adding this network still does not sign or broadcast anything.'
      : complete
        ? 'Test RPC reachability and Chain ID match before this network can be used by requests.'
        : 'Fill the five Add network fields, then test the RPC before adding it to this wallet.';
    const requestCopy = fromRequest
      ? '<div class="network-form-note">' + icon('info', 20) + '<div><strong>Opened from a Payment Request</strong>Base Sepolia was prefilled from the disabled request. You still verify RPC locally and return to Payment Review before any signature.</div></div>'
      : '';
    return '<div class="risk ' + (verified ? 'safe' : 'caution') + '">' + icon(verified ? 'shield' : 'info', 22) + '<div><strong>' + title + '</strong><div style="font-size:var(--text-sm);margin-top:2px">' + copy + '</div></div></div>' + requestCopy;
  }

  function renderNotifications() {
    return [
      renderSubheader('Settings', 'Notifications', 'settings'),
      '<section class="stack">',
      '<div class="card">' + prefRow('requests', 'zap', 'Payment Requests', 'Alert when an agent asks you to review a payment') + prefRow('confirmations', 'check', 'Signature confirmations', 'Tell you when a local signature is complete') + prefRow('riskAlerts', 'alert', 'Risk alerts', 'Show blocked or missing-context requests immediately') + '</div>',
      '<div class="card sage"><div class="eyebrow">Quiet by default</div><p class="subtle" style="margin:var(--space-2) 0 0;color:var(--green-900)">Notifications are factual: who requested, what amount, which network, and whether local signing is required.</p></div>',

  function renderDeveloper() {
    return [
      renderSubheader('Open Platform', 'Developer quickstart', 'profile'),

      '<div class="code-snippet">POST /v0/payment_requests\n{\n  "amount": "24.00",\n  "asset": "USDC",\n  "network": "Base",\n  "recipient": "0x9b1c...8293",\n  "context": "vp_ctx_example_0001"\n}</div>',
      '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">Required context</div>' + fact('User intent', 'Plain-language task summary') + fact('Agent trace', 'Steps the agent took') + fact('Evidence', 'Merchant, item, receipt, or source page') + fact('Signature', 'User only, local device') + '</div>',
      '<div class="card">' + permissionStatic('zap', 'payment.requests.create', 'Create a request for the user to review.', 'agent capability') + permissionStatic('clock', 'payment.requests.read', 'Read status for requests this app created.', 'agent capability') + permissionStatic('key', 'wallet.sign', 'Not available to agents or apps.', 'not grantable') + '</div>',

  function renderActivity() {
    // Only real in-session records are listed. A new wallet has no history.
    const rows = manualActivityRow() + scanTransferActivityRow();
    return [
      renderSubheader('Personal center', 'Activity history', 'profile'),
      '<section class="stack">',
      rows
        ? '<div class="card"><div class="section-title" style="font-size:var(--text-lg);margin-bottom:var(--space-2)">All records</div>' + rows + '</div>'

  function manualActivityRow() {
    if (state.manualStatus === 'review') return '';
    const summary = manualDraftSummary();
    const total = summary.totalAuthorization;
    const meta = {
      signed: ['Manual transfer · ' + summary.tokenName, 'Signed locally · not broadcast', total, 'info'],
      broadcasting: ['Manual transfer · ' + summary.tokenName, 'Broadcasting · tx submitted', '-' + total, 'info'],
      confirmed: ['Manual transfer · ' + summary.tokenName, 'Confirmed · amount and fee settled', '-' + total, 'safe'],
      failed: ['Manual transfer · ' + summary.tokenName, 'Broadcast failed · no balance change', '0.00 ' + summary.token, 'danger']
    }[state.manualStatus];
    return meta ? activityRow(meta[0], meta[1], meta[2], meta[3]) : '';
  }

  function scanTransferActivityRow() {
    const meta = {
      signed: ['Scanned payment', 'Signed locally · not broadcast', scanTransfer.total, 'info'],
      broadcasting: ['Scanned payment', 'Broadcasting · tx submitted', scanTransfer.total, 'info'],
      confirmed: ['Scanned payment', 'Confirmed · QR payment settled', scanTransfer.total, 'safe'],
      failed: ['Scanned payment', 'Broadcast failed · no balance change', '0.00 USDC', 'danger']
