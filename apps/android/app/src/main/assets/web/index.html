<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VelarumPay Mobile Wallet Main Flow Overview</title>
<link rel="stylesheet" href="./design-system/VelarumPay-DS-Core/styles.css" />
<link rel="stylesheet" href="./shared/accessibility-i18n.css" />
<style>
  :root {
    --phone-w: 402px;
    --phone-h: 874px;
    --nav-h: 78px;
    --action-h: 92px;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    background: var(--surface-page);
    font-family: var(--font-sans);
    color: var(--text-body);
  }

  button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--space-8);
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(255,255,255,0.9), transparent 70%),
      var(--surface-page);
  }

  .phone {
    width: min(var(--phone-w), calc(100vw - 28px));
    height: min(var(--phone-h), calc(100vh - 48px));
    min-height: 720px;
    position: relative;
    overflow: hidden;
    border-radius: 48px;
    background: var(--surface-page);
    box-shadow: 0 40px 80px rgba(26, 30, 26, 0.18), 0 0 0 1px rgba(26, 30, 26, 0.14);
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface-page);
  }

  .status-bar {
    height: 52px;
    padding: 18px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    color: var(--text-strong);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
    flex: 0 0 auto;
  }

  .status-icons {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: var(--radius-circle);
    background: currentColor;
  }

  .battery {
    width: 25px;
    height: 12px;
    border: 2px solid currentColor;
    border-radius: 5px;
    position: relative;
  }

  .battery::before {
    content: "";
    position: absolute;
    right: -5px;
    top: 3px;
    width: 3px;
    height: 5px;
    border-radius: 2px;
    background: currentColor;
  }

  .battery::after {
    content: "";
    position: absolute;
    inset: 2px 6px 2px 2px;
    border-radius: 2px;
    background: currentColor;
  }

  .topbar {
    height: 82px;
    padding: 12px 24px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }

  .topbar[hidden] {
    display: none !important;
  }

  .brand-lockup {
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: var(--space-3);
    color: var(--text-strong);
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    display: block;
  }

  .brand-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .brand-title {
    font-family: var(--font-display);
    font-size: 1.375rem;
    line-height: var(--leading-none);
    font-weight: var(--weight-bold);
    color: var(--text-strong);
    white-space: nowrap;
  }

  .brand-subtitle {
    font-size: var(--text-base);
    line-height: var(--leading-tight);
    font-weight: var(--weight-medium);
    color: var(--text-muted);
    white-space: nowrap;
  }

  @media (max-width: 420px) {
    .topbar {
      padding-inline: 18px;
    }
  }

  .top-spacer {
    flex: 1;
  }

  .search-btn {
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: var(--radius-pill);
    border: 1px solid color-mix(in srgb, var(--green-600) 28%, transparent);
    background: rgba(255, 255, 255, 0.58);
    color: var(--green-700);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--weight-semibold);
    box-shadow: var(--shadow-xs);
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out), background var(--duration-base) var(--ease-standard);
  }

  .scan-btn,
  .round-btn {
    width: 46px;
    height: 46px;
    border-radius: var(--radius-pill);
    border: 1px solid color-mix(in srgb, var(--green-600) 22%, transparent);
    background: rgba(255, 255, 255, 0.72);
    color: var(--green-700);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform var(--duration-fast) var(--ease-out), background var(--duration-base) var(--ease-standard);
  }

  .search-btn:active,
  .scan-btn:active,
  .round-btn:active,
  .pill:active,
  .button:active,
  .nav-item:active,
  .asset-row:active,
  .request-card:active {
    transform: scale(var(--press-scale));
  }

  button svg {
    pointer-events: none;
  }

  .screen {
    flex: 1;
    overflow: auto;
    padding: 0 24px calc(var(--nav-h) + 22px);
    scrollbar-width: none;
  }

  .screen::-webkit-scrollbar {
    display: none;
  }

  .screen.with-action {
    padding-bottom: calc(var(--nav-h) + var(--action-h) + 20px);
  }

  .screen.no-nav {
    padding-bottom: 28px;
  }

  .screen.no-nav.with-action {
    padding-bottom: calc(var(--action-h) + 24px);
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .card {
    background: var(--surface-card);
    border-radius: var(--radius-xl);
    border: 1px solid transparent;
    box-shadow: var(--shadow-card);
    padding: var(--space-6);
  }

  .card.sage {
    background: rgba(255,255,255,0.48);
    border-color: color-mix(in srgb, var(--green-600) 14%, transparent);
    box-shadow: none;
  }

  .balance-card {
    min-height: 184px;
    border-radius: var(--radius-xl);
    background: var(--green-600);
    color: var(--text-on-brand);
    box-shadow: var(--shadow-brand);
    padding: var(--space-6);
  }

  .eyebrow {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--color-primary);
  }

  .on-dark {
    color: color-mix(in srgb, var(--text-on-brand) 74%, transparent);
  }

  .title {
    margin: 0;
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    line-height: var(--leading-tight);
    font-weight: var(--weight-bold);
    letter-spacing: 0;
  }

  .subtle {
    color: var(--text-muted);
    font-size: var(--text-base);
    line-height: var(--leading-normal);
  }

  .mono {
    font-family: var(--font-mono);
    font-feature-settings: "tnum" 1;
    letter-spacing: 0;
  }

  .balance-value {
    margin-top: var(--space-3);
    font-family: var(--font-mono);
    font-size: 40px;
    line-height: 1.2;
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    min-height: 52px;
  }

  .balance-token {
    font-family: var(--font-sans);
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    margin-left: var(--space-1);
  }

  .balance-fiat {
    margin-top: var(--space-2);
    color: color-mix(in srgb, var(--text-on-brand) 78%, transparent);
    font-family: var(--font-mono);
    font-size: var(--text-md);
  }

  .balance-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
    align-items: center;
    margin-top: var(--space-6);
  }

  .button {
    height: var(--control-h-md);
    border-radius: var(--radius-pill);
    border: 1px solid transparent;
    padding: 0 var(--space-5);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out), background var(--duration-base) var(--ease-standard);
    white-space: nowrap;
  }

  .button.white {
    background: var(--surface-card);
    color: var(--text-strong);
    box-shadow: var(--shadow-xs);
  }

  .button.secondary {
    background: var(--surface-card);
    color: var(--text-strong);
    border-color: var(--border-default);
  }

  .button.green {
    background: var(--color-primary);
    color: var(--color-on-primary);
  }

  .button.danger {
    background: var(--red-500);
    color: #fff;
  }

  .button:disabled,
  .pill:disabled {
    cursor: not-allowed;
    opacity: 0.48;
    transform: none;
  }

  .pill {
    min-height: var(--control-h-md);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--color-emphasis);
    color: var(--color-on-emphasis);
    padding: 0 var(--space-6);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out), background var(--duration-base) var(--ease-standard);
  }

  .pill.full,
  .button.full {
    width: 100%;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    margin: 0 var(--space-2) var(--space-3);
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: var(--weight-bold);
    font-size: var(--text-xl);
    color: var(--text-strong);
    line-height: var(--leading-tight);
  }

  .section-note {
    color: var(--text-muted);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
  }

  .asset-panel {
    border-radius: var(--radius-2xl);
    background: rgba(255,255,255,0.34);
    border: 1px solid color-mix(in srgb, var(--green-600) 14%, transparent);
    padding: var(--space-4);
    box-shadow: none;
  }

  .asset-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-1) var(--space-4);
  }

  .asset-panel-title {
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: var(--weight-bold);
  }

  .asset-add-btn {
    width: 42px;
    height: 42px;
    box-shadow: var(--shadow-xs);
  }

  .asset-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .asset-row {
    width: 100%;
    min-height: 86px;
    border: 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-xs);
    padding: 14px;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) 76px;
    gap: var(--space-3);
    align-items: center;
    text-align: left;
    color: var(--text-body);
    cursor: pointer;
    overflow: hidden;
  }

  .asset-mark {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-circle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: var(--weight-bold);
  }

  .asset-copy {
    min-width: 0;
    overflow: hidden;
  }

  .asset-title {
    display: block;
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    line-height: var(--leading-tight);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .asset-address {
    display: block;
    margin-top: var(--space-1);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .asset-balance {
    text-align: right;
    min-width: 0;
  }

  .asset-balance strong {
    display: block;
    color: var(--green-700);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
  }

  .asset-balance span {
    display: block;
    color: var(--text-muted);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
  }

  .asset-toggle-btn {
    min-width: 78px;
    padding: 0 var(--space-4);
  }

  .asset-toggle-btn.on {
    background: var(--green-50);
    border-color: color-mix(in srgb, var(--green-600) 24%, transparent);
    color: var(--green-800);
  }

  .identity-hero {
    border: 0;
    width: 100%;
    border-radius: var(--radius-2xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
    color: var(--text-body);
    text-align: left;
    cursor: pointer;
  }

  .identity-avatar {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-xl);
    background: var(--green-50);
    color: var(--green-700);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: var(--weight-bold);
    flex: 0 0 auto;
  }

  .identity-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--border-subtle);
  }

  .identity-row:last-child {
    border-bottom: 0;
  }

  .identity-preview {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    min-width: 0;
  }

  .asset-detail-hero {
    border-radius: var(--radius-2xl);
    background: var(--green-600);
    color: var(--text-on-brand);
    box-shadow: var(--shadow-brand);
    padding: var(--space-6);
  }

  .asset-detail-head {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }

  .asset-detail-mark {
    width: 66px;
    height: 66px;
    border-radius: var(--radius-circle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    flex: 0 0 auto;
  }

  .asset-detail-name {
    display: block;
    color: var(--text-on-brand);
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: var(--weight-bold);
    line-height: var(--leading-tight);
  }

  .asset-detail-network {
    display: block;
    margin-top: var(--space-1);
    color: color-mix(in srgb, var(--text-on-brand) 78%, transparent);
    font-weight: var(--weight-semibold);
  }

  .asset-detail-amount {
    margin-top: var(--space-6);
    font-family: var(--font-mono);
    font-size: 42px;
    line-height: 1.2;
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
  }

  .asset-detail-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
    margin-top: var(--space-6);
  }

  .asset-send-summary {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: var(--space-3);
    align-items: center;
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--surface-card) 78%, var(--sage-50));
    border: 1px solid var(--border-subtle);
    padding: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .asset-send-summary strong,
  .asset-send-summary em {
    display: block;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .asset-send-summary strong {
    color: var(--text-strong);
    font-weight: var(--weight-bold);
  }

  .asset-send-summary em {
    color: var(--text-muted);
    font-size: var(--text-xs);
    font-style: normal;
    margin-top: 2px;
  }

  .transfer-check-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-2);
  }

  .transfer-check-grid span {
    min-height: 34px;
    border-radius: var(--radius-lg);
    background: var(--green-50);
    color: var(--green-800);
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 0 var(--space-3);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-snug);
  }

  .form-stack {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .field-card {
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    background: var(--sage-50);
    padding: var(--space-4);
  }

  .field-label {
    display: block;
    color: var(--text-muted);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    margin-bottom: var(--space-2);
  }

  .field-value {
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
  }

  .manual-input-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-3);
    align-items: center;
  }

  .manual-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-strong);
    font: inherit;
    font-weight: var(--weight-semibold);
    line-height: var(--leading-snug);
  }

  .manual-input.mono {
    font-family: var(--font-mono);
    font-size: var(--text-xl);
    letter-spacing: 0;
  }

  .manual-input::placeholder {
    color: color-mix(in srgb, var(--text-muted) 62%, transparent);
  }

  .manual-input-addon {
    color: var(--text-strong);
    font-family: var(--font-mono);
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
  }

  .field-help {
    display: block;
    margin-top: var(--space-2);
    color: var(--text-muted);
    font-size: var(--text-xs);
    line-height: var(--leading-snug);
  }

  .field-help.danger {
    color: var(--red-700);
  }

  .rpc-field {
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    background: var(--sage-50);
    padding: var(--space-4);
  }

  .rpc-field-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-2);
  }

  .rpc-value {
    color: var(--text-strong);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    word-break: break-word;
  }

  .add-network-card {
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
  }

  .add-network-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .add-network-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .add-network-label {
    color: var(--text-strong);
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    line-height: var(--leading-tight);
  }

  .network-input-shell {
    min-height: 58px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
    padding: 0 var(--space-4);
    transition: border-color var(--duration-base) var(--ease-standard), box-shadow var(--duration-base) var(--ease-standard);
  }

  .network-input-shell.with-affix {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-2);
  }

  .network-input-shell:focus-within {
    border-color: var(--color-primary);
    box-shadow: var(--focus-ring);
  }

  .network-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-strong);
    font: inherit;
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    line-height: var(--leading-snug);
  }

  .network-input.mono {
    font-family: var(--font-mono);
    letter-spacing: 0;
  }

  .network-input::placeholder {
    color: var(--text-faint);
  }

  .network-affix {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--text-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .network-form-note {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: flex-start;
    gap: var(--space-3);
    border-radius: var(--radius-lg);
    background: var(--green-50);
    color: var(--green-900);
    padding: var(--space-4);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
  }

  .network-form-note strong {
    display: block;
    color: var(--green-800);
    margin-bottom: 2px;
  }

  .network-summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .network-summary-chip {
    min-width: 0;
    border-radius: var(--radius-lg);
    background: var(--sage-50);
    border: 1px solid var(--border-subtle);
    padding: var(--space-4);
  }

  .network-summary-chip span {
    display: block;
    color: var(--text-muted);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    margin-bottom: var(--space-1);
  }

  .network-summary-chip strong {
    display: block;
    color: var(--text-strong);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    word-break: break-word;
  }

  .network-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
    margin-top: var(--space-5);
  }

  .receive-qr {
    width: 184px;
    height: 184px;
  }

  .address-card {
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
  }

  .copy-line {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-width: 0;
  }

  .copy-line .address {
    max-width: none;
    flex: 1 1 auto;
  }

  .doc-card {
    width: 100%;
    border: 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
    color: var(--text-body);
    text-align: left;
  }

  .doc-card.interactive {
    cursor: pointer;
  }

  .code-snippet {
    border-radius: var(--radius-lg);
    background: var(--stone-900);
    color: var(--text-on-dark);
    padding: var(--space-4);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    line-height: var(--leading-relaxed);
    overflow-x: auto;
    white-space: pre;
  }

  .settings-link {
    width: 100%;
    border: 0;
    background: transparent;
    color: inherit;
    padding: 0;
    text-align: left;
    cursor: pointer;
  }

  .settings-link .switch-row {
    border-bottom: 1px solid var(--border-subtle);
  }

  .settings-link:last-child .switch-row {
    border-bottom: 0;
  }

  .network-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .network-card {
    min-height: 118px;
    border-radius: var(--radius-lg);
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--text-body);
    text-align: left;
    cursor: pointer;
  }

  .network-card strong,
  .network-card span {
    display: block;
  }

  .network-card strong {
    color: var(--text-strong);
  }

  .network-card span {
    color: var(--text-muted);
    font-size: var(--text-sm);
  }

  .key-action {
    width: 100%;
    border: 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
    color: var(--text-body);
    text-align: left;
    cursor: pointer;
  }

  .secret-panel {
    border-radius: var(--radius-2xl);
    background: var(--stone-900);
    color: var(--text-on-dark);
    padding: var(--space-6);
    box-shadow: var(--shadow-lg);
  }

  .secret-mask {
    min-height: 190px;
    border-radius: var(--radius-xl);
    border: 1px dashed rgba(255,255,255,0.34);
    display: grid;
    place-items: center;
    color: rgba(255,255,255,0.74);
    text-align: center;
    padding: var(--space-5);
  }

  .seed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .seed-word {
    min-width: 0;
    border-radius: var(--radius-lg);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    padding: var(--space-3);
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: var(--space-2);
    align-items: center;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
  }

  .seed-word span:first-child {
    color: rgba(255,255,255,0.54);
  }

  .seed-word span:last-child {
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .import-box {
    min-height: 128px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-default);
    background: var(--sage-50);
    padding: var(--space-4);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    line-height: var(--leading-relaxed);
    white-space: pre-wrap;
  }

  .method-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .method-chip {
    min-height: 92px;
    border-radius: var(--radius-lg);
    background: var(--sage-50);
    border: 1px solid var(--border-subtle);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--text-body);
  }

  .method-chip strong,
  .method-chip span {
    display: block;
  }

  .method-chip strong {
    color: var(--text-strong);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
  }

  .method-chip span {
    color: var(--text-muted);
    font-size: var(--text-xs);
    line-height: var(--leading-snug);
  }

  .method-chip.full {
    grid-column: 1 / -1;
  }

  .method-chip.disabled {
    opacity: 0.58;
    cursor: not-allowed;
    background: var(--stone-100);
  }

  .wallet-setup-steps {
    display: grid;
    gap: var(--space-3);
  }

  .setup-step {
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    background: var(--surface-card);
    padding: var(--space-4);
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: var(--space-3);
    align-items: start;
  }

  .setup-step-number {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-pill);
    background: var(--green-50);
    color: var(--green-800);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
  }

  .setup-step strong,
  .setup-step span {
    display: block;
  }

  .setup-step strong {
    color: var(--text-strong);
    line-height: var(--leading-snug);
  }

  .setup-step span {
    color: var(--text-muted);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    margin-top: 3px;
  }

  .nav {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    height: var(--nav-h);
    padding: var(--space-2) var(--space-5) var(--space-4);
    background: rgba(255, 255, 255, 0.86);
    border-top: 1px solid var(--border-subtle);
    backdrop-filter: blur(14px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-1);
  }

  .nav[hidden] {
    display: none !important;
  }

  .nav-item {
    border: 0;
    background: transparent;
    color: var(--text-muted);
    border-radius: var(--radius-xl);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    position: relative;
  }

  .nav-item.active {
    background: var(--surface-card);
    color: var(--green-700);
    box-shadow: var(--shadow-xs);
  }

  .nav-badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 22px);
    min-width: 18px;
    height: 18px;
    border-radius: var(--radius-pill);
    background: var(--status-pending);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: var(--weight-bold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }

  .subheader {
    position: sticky;
    top: 0;
    z-index: 14;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin: 0 -24px var(--space-5);
    padding: var(--space-2) 24px var(--space-5);
    background: color-mix(in srgb, var(--surface-page) 88%, transparent);
    backdrop-filter: blur(14px);
  }

  .subheader-title {
    min-width: 0;
    flex: 1;
  }

  .subheader-title h1 {
    margin: 0;
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    line-height: var(--leading-tight);
    letter-spacing: 0;
  }

  .request-card {
    width: 100%;
    border: 0;
    background: var(--surface-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
    text-align: left;
    cursor: pointer;
    color: var(--text-body);
  }

  .request-card.danger {
    box-shadow: var(--shadow-card), inset 0 0 0 2px color-mix(in srgb, var(--red-500) 30%, transparent);
  }

  .request-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .request-top > .agent {
    flex: 1 1 0;
    width: 0;
  }

  .request-top > .badge {
    flex: 0 0 auto;
  }

  .agent {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-width: 0;
    overflow: hidden;
  }

  .agent-mark {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    background: var(--green-50);
    color: var(--green-700);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: var(--weight-bold);
    flex: 0 0 auto;
  }

  .agent-copy {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
  }

  .agent-name {
    display: block;
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .agent-sub {
    display: block;
    color: var(--text-muted);
    font-size: var(--text-sm);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .agent-list-card {
    overflow: hidden;
  }

  .agent-list-card .request-top {
    align-items: center;
  }

  .task-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  .task-chip {
    border-radius: var(--radius-lg);
    background: var(--sage-50);
    border: 1px solid var(--border-subtle);
    padding: var(--space-4);
    min-width: 0;
  }

  .task-chip strong,
  .task-chip span {
    display: block;
  }

  .merchant-card {
    overflow: hidden;
  }

  .merchant-proof {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: var(--space-4);
    align-items: center;
  }

  .merchant-logo {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-lg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: var(--font-display);
    font-weight: var(--weight-bold);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
  }

  .merchant-logo.food {
    background: linear-gradient(145deg, #2a7f49, #74a766);
  }

  .merchant-logo.hardware {
    background: linear-gradient(145deg, #1c2930, #77856e);
  }

  .merchant-logo.travel {
    background: linear-gradient(145deg, #214d69, #8ca77f);
  }

  .merchant-logo.books {
    background: linear-gradient(145deg, #5c4128, #b28b5b);
  }

  .merchant-name {
    display: block;
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: var(--weight-bold);
    line-height: var(--leading-snug);
  }

  .merchant-meta {
    display: block;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: var(--text-sm);
  }

  .merchant-facts {
    margin-top: var(--space-4);
  }

  .evidence-strip {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 134px;
    gap: var(--space-3);
    overflow-x: auto;
    padding: 2px 2px var(--space-1);
    scrollbar-width: none;
  }

  .evidence-strip::-webkit-scrollbar {
    display: none;
  }

  .evidence-card {
    min-width: 0;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--sage-50);
    padding: var(--space-3);
  }

  .evidence-card.missing {
    border-style: dashed;
    background: var(--risk-caution-bg);
  }

  .evidence-thumb {
    height: 86px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: var(--space-3);
    overflow: hidden;
    position: relative;
  }

  .evidence-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.3), transparent 46%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.25), transparent 26%);
  }

  .evidence-thumb svg {
    position: relative;
    z-index: 1;
  }

  .evidence-thumb.food {
    background: linear-gradient(145deg, #34764a, #d4a85f);
  }

  .evidence-thumb.drink {
    background: linear-gradient(145deg, #2f8174, #9fcfc2);
  }

  .evidence-thumb.receipt {
    background: linear-gradient(145deg, #7c855f, #f2e4bc);
  }

  .evidence-thumb.hardware {
    background: linear-gradient(145deg, #18242b, #73827c);
  }

  .evidence-thumb.travel {
    background: linear-gradient(145deg, #244d68, #b8d7cc);
  }

  .evidence-thumb.books {
    background: linear-gradient(145deg, #5c4128, #d6b77b);
  }

  .evidence-thumb.missing {
    background: transparent;
    color: var(--amber-700);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber-700) 30%, transparent);
  }

  .evidence-thumb.missing::after {
    background: none;
  }

  .evidence-title {
    display: block;
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-snug);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .evidence-meta {
    display: block;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: var(--text-xs);
    line-height: var(--leading-snug);
  }

  .decision-note {
    border-radius: var(--radius-lg);
    background: var(--sage-50);
    border: 1px solid var(--border-subtle);
    padding: var(--space-4);
    color: var(--text-body);
    line-height: var(--leading-snug);
  }

  .decision-note strong {
    display: block;
    color: var(--text-strong);
    margin-bottom: var(--space-2);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: var(--radius-pill);
    padding: 6px 11px;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
  }

  .badge.success { background: var(--status-success-bg); color: var(--green-700); }
  .badge.pending { background: var(--status-pending-bg); color: var(--amber-700); }
  .badge.failed { background: var(--status-failed-bg); color: var(--red-700); }
  .badge.info { background: var(--status-info-bg); color: var(--blue-700); }
  .badge.neutral { background: var(--stone-100); color: var(--text-body); }

  .request-title {
    margin-top: var(--space-4);
    color: var(--text-strong);
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: var(--weight-bold);
    line-height: var(--leading-snug);
  }

  .request-meta {
    margin-top: var(--space-1);
    color: var(--text-muted);
    font-size: var(--text-sm);
    line-height: var(--leading-normal);
  }

  .request-foot {
    margin-top: var(--space-4);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-1);
    padding: var(--space-1);
    border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--sage-100) 72%, #fff);
    border: 1px solid var(--border-subtle);
  }

  .search-field {
    height: 54px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-default);
    background: var(--surface-card);
    box-shadow: var(--shadow-xs);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: 0 var(--space-4);
    color: var(--text-muted);
  }

  .search-field input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-strong);
    font: inherit;
  }

  .search-field input::placeholder {
    color: var(--text-faint);
  }

  .search-chip-row {
    display: flex;
    gap: var(--space-2);
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }

  .search-chip-row::-webkit-scrollbar {
    display: none;
  }

  .search-chip {
    min-height: 36px;
    padding: 0 var(--space-4);
    border: 1px solid color-mix(in srgb, var(--green-600) 18%, transparent);
    border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.68);
    color: var(--green-900);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
    cursor: pointer;
  }

  .search-chip.active {
    background: var(--green-600);
    color: #fff;
    border-color: transparent;
    box-shadow: var(--shadow-xs);
  }

  .search-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--text-muted);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
  }

  .search-clear {
    border: 0;
    background: transparent;
    color: var(--green-700);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    padding: 0;
  }

  .segment {
    border: 0;
    height: 36px;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--text-muted);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }

  .segment.active {
    background: var(--surface-card);
    color: var(--text-strong);
    box-shadow: var(--shadow-xs);
  }

  .fact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--border-subtle);
  }

  .fact-row:last-child {
    border-bottom: 0;
  }

  .fact-label {
    color: var(--text-muted);
  }

  .fact-value {
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    text-align: right;
    min-width: 0;
  }

  .address {
    display: inline-flex;
    align-items: center;
    max-width: 160px;
    padding: 6px 10px;
    border-radius: var(--radius-pill);
    background: var(--stone-100);
    color: var(--text-body);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .risk {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    border-radius: var(--radius-xl);
    padding: var(--space-4);
  }

  .risk.safe { background: var(--risk-safe-bg); color: var(--green-800); }
  .risk.info { background: var(--status-info-bg); color: var(--blue-700); }
  .risk.caution { background: var(--risk-caution-bg); color: var(--amber-700); }
  .risk.danger { background: var(--risk-danger-bg); color: var(--red-700); }

  .truth-panel {
    display: grid;
    gap: var(--space-3);
  }

  .truth-section {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    background: color-mix(in srgb, var(--surface-card) 82%, var(--sage-50));
    overflow: hidden;
  }

  .truth-section.safe {
    border-color: color-mix(in srgb, var(--green-600) 22%, var(--border-subtle));
  }

  .truth-section.caution {
    border-color: color-mix(in srgb, var(--amber-700) 30%, var(--border-subtle));
    background: var(--risk-caution-bg);
  }

  .truth-section.danger {
    border-color: color-mix(in srgb, var(--red-700) 30%, var(--border-subtle));
    background: var(--risk-danger-bg);
  }

  .truth-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4);
    border-bottom: 1px solid color-mix(in srgb, var(--border-subtle) 72%, transparent);
  }

  .truth-title {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    min-width: 0;
  }

  .truth-note {
    color: var(--text-muted);
    font-size: var(--text-xs);
    white-space: nowrap;
  }

  .truth-row {
    padding: var(--space-4);
    display: grid;
    gap: var(--space-2);
    border-bottom: 1px solid color-mix(in srgb, var(--border-subtle) 72%, transparent);
  }

  .truth-row:last-child {
    border-bottom: 0;
  }

  .truth-row-main {
    display: flex;
    justify-content: space-between;
    gap: var(--space-3);
    align-items: flex-start;
  }

  .truth-field {
    color: var(--text-muted);
    font-size: var(--text-sm);
    min-width: 0;
  }

  .truth-value {
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    text-align: right;
    min-width: 0;
  }

  .truth-meta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .truth-evidence {
    color: var(--text-muted);
    font-size: var(--text-xs);
    line-height: var(--leading-snug);
  }

  .state-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
    margin-top: var(--space-5);
  }

  .screen > .stack > .state-actions:last-child {
    position: absolute;
    left: var(--space-5);
    right: var(--space-5);
    bottom: calc(var(--nav-h) + var(--space-4));
    z-index: 19;
    margin: 0;
    padding: var(--space-3);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-2xl);
    background: rgba(255,255,255,0.9);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(14px);
  }

  .screen > .stack > .pill.full:last-child,
  .screen > .stack > .button.full:last-child {
    position: absolute;
    left: var(--space-5);
    right: var(--space-5);
    bottom: calc(var(--nav-h) + var(--space-4));
    z-index: 19;
    width: auto;
    box-shadow: var(--shadow-md);
  }

  .screen.no-nav > .stack > .state-actions:last-child,
  .screen.no-nav > .stack > .pill.full:last-child,
  .screen.no-nav > .stack > .button.full:last-child {
    bottom: var(--space-5);
  }

  .sign-progress {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
    margin: var(--space-5) 0;
  }

  .sign-step {
    min-width: 0;
    border-radius: var(--radius-lg);
    background: var(--stone-100);
    color: var(--text-muted);
    padding: var(--space-3);
    text-align: center;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
  }

  .sign-step.done,
  .sign-step.active {
    background: var(--green-50);
    color: var(--green-800);
  }

  .sign-auth-card {
    border-radius: var(--radius-2xl);
    background: var(--stone-900);
    color: var(--text-on-dark);
    padding: var(--space-6);
    text-align: center;
  }

  .manual-status-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--space-2);
  }

  .manual-state {
    min-width: 0;
    border-radius: var(--radius-lg);
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    padding: var(--space-3);
    text-align: center;
    color: var(--text-muted);
  }

  .manual-state strong,
  .manual-state span {
    display: block;
  }

  .manual-state strong {
    color: inherit;
    font-size: var(--text-xs);
    line-height: var(--leading-snug);
  }

  .manual-state span {
    margin-top: 2px;
    font-family: var(--font-mono);
    font-size: 10px;
  }

  .manual-state.done,
  .manual-state.active {
    background: var(--green-50);
    color: var(--green-800);
    border-color: color-mix(in srgb, var(--green-600) 24%, transparent);
  }

  .manual-state.failed {
    background: var(--red-100);
    color: var(--red-700);
    border-color: color-mix(in srgb, var(--red-500) 28%, transparent);
  }

  .sign-auth-icon {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-circle);
    border: 1px solid rgba(255,255,255,0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-4);
  }

  .signature-receipt {
    border-radius: var(--radius-xl);
    background: var(--green-50);
    color: var(--green-900);
    padding: var(--space-4);
    margin-top: var(--space-5);
  }

  .line-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) 0;
    color: var(--text-body);
  }

  .leader {
    flex: 1;
    border-bottom: 1px dotted var(--border-strong);
    transform: translateY(-3px);
  }

  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: var(--space-3);
  }

  .step-number {
    width: 28px;
    height: 28px;
    border-radius: var(--radius-pill);
    background: var(--green-600);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
  }

  .step-rail {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .step-line {
    width: 2px;
    flex: 1;
    min-height: 22px;
    background: var(--green-200);
    margin: 4px 0;
  }

  .step:last-child .step-line {
    display: none;
  }

  .step-body {
    padding-bottom: var(--space-5);
  }

  .step:last-child .step-body {
    padding-bottom: 0;
  }

  .step-title {
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
  }

  .step-copy {
    color: var(--text-muted);
    font-size: var(--text-sm);
    line-height: var(--leading-normal);
    margin-top: 2px;
  }

  .action-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--nav-h);
    min-height: var(--action-h);
    padding: var(--space-4) var(--space-5);
    background: rgba(255,255,255,0.9);
    border-top: 1px solid var(--border-subtle);
    backdrop-filter: blur(14px);
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: var(--space-3);
    align-items: center;
    z-index: 18;
  }

  .action-bar.no-nav {
    bottom: 0;
  }

  .action-label {
    font-family: var(--font-display);
    color: var(--text-muted);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .action-amount {
    color: var(--text-strong);
    font-family: var(--font-mono);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
  }

  .switch-row {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--border-subtle);
  }

  .switch-row:last-child {
    border-bottom: 0;
  }

  .switch-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: var(--green-50);
    color: var(--green-700);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .switch {
    width: 46px;
    height: 28px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--stone-300);
    padding: 0;
    position: relative;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: var(--radius-circle);
    background: #fff;
    box-shadow: var(--shadow-sm);
    transition: transform var(--duration-base) var(--ease-out);
  }

  .switch.on {
    background: var(--color-primary);
  }

  .switch.on::after {
    transform: translateX(18px);
  }

  .switch[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .qr-card {
    border-radius: var(--radius-2xl);
    background: var(--green-600);
    padding: var(--space-6);
    box-shadow: var(--shadow-brand);
    color: #fff;
  }

  .qr {
    width: 170px;
    height: 170px;
    margin: 0 auto;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    border: 14px solid #fff;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    line-height: 0;
  }

  .code-box {
    height: 48px;
    border-radius: var(--radius-lg);
    background: var(--surface-card);
    color: var(--text-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--space-5);
    font-family: var(--font-mono);
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    letter-spacing: 0;
  }

  .scan-screen {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--space-8);
    padding-top: var(--space-2);
  }

  .scan-back {
    justify-self: start;
  }

  .scanner-card {
    align-self: center;
    border-radius: var(--radius-2xl);
    background: var(--green-600);
    box-shadow: var(--shadow-brand);
    padding: var(--space-8);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  .scanner-card.transfer {
    align-self: start;
    gap: var(--space-6);
    text-align: center;
    color: #fff;
  }

  .scanner-card.transfer .pill {
    width: 100%;
    background: #fff;
    color: var(--green-900);
  }

  .scan-mode-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
    width: 100%;
  }

  .scan-mode {
    min-height: 40px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.72);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }

  .scan-mode.active {
    background: #fff;
    color: var(--green-900);
    border-color: transparent;
  }

  .scan-sample-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-2);
    width: 100%;
  }

  .scan-sample {
    min-height: 42px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: var(--radius-lg);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }

  .scan-supported {
    display: grid;
    gap: var(--space-2);
  }

  .scan-supported-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--sage-100) 64%, #fff);
    color: var(--text-strong);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
  }

  .scan-raw {
    word-break: break-all;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--text-muted);
    line-height: var(--leading-normal);
  }

  .scanner-frame {
    width: min(260px, 72vw);
    aspect-ratio: 1;
    border-radius: var(--radius-2xl);
    background: rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .scanner-frame::before,
  .scanner-frame::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    border-radius: var(--radius-pill);
  }

  .scanner-frame::before {
    top: 50%;
    height: 2px;
    background: rgba(255,255,255,0.78);
    box-shadow: 0 0 18px rgba(255,255,255,0.45);
  }

  .scanner-frame::after {
    top: 0;
    bottom: 0;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px) 0 0 / 36px 36px,
      linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px) 0 0 / 36px 36px;
    opacity: 0.8;
  }

  .scanner-corner {
    position: absolute;
    width: 54px;
    height: 54px;
    color: var(--text-on-brand);
    z-index: 1;
  }

  .scanner-corner::before,
  .scanner-corner::after {
    content: "";
    position: absolute;
    background: currentColor;
    border-radius: var(--radius-pill);
  }

  .scanner-corner::before {
    width: 100%;
    height: 6px;
  }

  .scanner-corner::after {
    width: 6px;
    height: 100%;
  }

  .scanner-corner.tl { top: 0; left: 0; }
  .scanner-corner.tr { top: 0; right: 0; transform: scaleX(-1); }
  .scanner-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .scanner-corner.br { bottom: 0; right: 0; transform: scale(-1); }

  .scanner-copy {
    display: grid;
    gap: var(--space-2);
  }

  .scanner-copy strong {
    color: #fff;
    font-size: var(--text-xl);
    line-height: var(--leading-tight);
  }

  .scanner-copy span {
    color: rgba(255,255,255,0.76);
    font-size: var(--text-sm);
    line-height: var(--leading-normal);
  }

  .scan-transfer-hero {
    border-radius: var(--radius-2xl);
    background: var(--green-600);
    color: #fff;
    box-shadow: var(--shadow-brand);
    padding: var(--space-6);
    display: grid;
    gap: var(--space-5);
  }

  .scan-transfer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
  }

  .scan-transfer-payee {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-width: 0;
  }

  .scan-transfer-mark {
    width: 46px;
    height: 46px;
    border-radius: var(--radius-circle);
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.16);
    color: #fff;
    font-weight: var(--weight-bold);
    flex: 0 0 auto;
  }

  .scan-transfer-name {
    display: block;
    color: #fff;
    font-weight: var(--weight-semibold);
    line-height: var(--leading-tight);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scan-transfer-source {
    display: block;
    color: rgba(255,255,255,0.7);
    font-size: var(--text-sm);
    margin-top: 2px;
  }

  .scan-transfer-amount {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    font-family: var(--font-display);
    font-size: 42px;
    line-height: var(--leading-none);
    font-weight: var(--weight-bold);
    letter-spacing: 0;
  }

  .scan-transfer-amount span {
    font-family: var(--font-sans);
    font-size: var(--text-lg);
    color: rgba(255,255,255,0.8);
  }

  .scan-status-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-2);
  }

  .scan-status-step {
    min-height: 54px;
    border-radius: var(--radius-lg);
    background: rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.64);
    display: grid;
    place-items: center;
    text-align: center;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    padding: var(--space-2);
  }

  .scan-status-step.active,
  .scan-status-step.done {
    background: rgba(255,255,255,0.22);
    color: #fff;
  }

  .scan-status-step.failed {
    background: var(--red-100);
    color: var(--red-700);
  }

  .toast {
    position: absolute;
    left: var(--space-5);
    right: var(--space-5);
    top: 62px;
    z-index: 50;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-lg);
    padding: var(--space-4);
    border-left: 4px solid var(--status-success);
    display: none;
    gap: var(--space-3);
    align-items: flex-start;
    pointer-events: none;
  }

  .toast.show {
    display: flex;
    animation: rise var(--duration-slow) var(--ease-out);
  }

  .toast.failed {
    border-left-color: var(--status-failed);
  }

  .modal-scrim {
    position: absolute;
    inset: 0;
    z-index: 45;
    background: rgba(20, 30, 20, 0.42);
    display: none;
    align-items: flex-end;
    padding: var(--space-5);
    backdrop-filter: blur(3px);
  }

  .modal-scrim.show {
    display: flex;
  }

  .modal {
    width: 100%;
    border-radius: var(--radius-2xl);
    background: var(--surface-card);
    box-shadow: var(--shadow-xl);
    padding: var(--space-6);
    animation: rise var(--duration-slow) var(--ease-out);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .stage {
      padding: 0;
      display: block;
    }

    .phone {
      width: 100vw;
      height: 100dvh;
      min-height: 0;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="phone" aria-label="VelarumPay mobile wallet prototype">
    <div class="app">
      <!-- Spacer only. The real OS status bar shows the time and system icons; the
           prototype no longer draws its own clock/icons (that caused a doubled time). -->
      <div class="status-bar" aria-hidden="true"></div>
      <header class="topbar">
        <div class="brand-lockup" aria-label="VelarumPay Personal wallet">
          <img class="brand-mark" src="./design-system/VelarumPay-DS-Core/assets/logo-mark.svg" alt="" aria-hidden="true" />
          <span class="brand-copy">
            <span class="brand-title">VelarumPay</span>
            <span class="brand-subtitle">Personal wallet</span>
          </span>
        </div>
        <span class="top-spacer"></span>
        <button class="search-btn" data-screen="assetSearch" type="button" aria-label="Search crypto assets"></button>
        <button class="scan-btn" data-action="home-scan" type="button" aria-label="Scan payment QR code"></button>
      </header>
      <div id="screen" class="screen"></div>
      <div id="actionRoot"></div>
      <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      <div id="toast" class="toast" role="status"></div>
      <div id="modalRoot" class="modal-scrim"></div>
    </div>
  </section>
</main>

<script src="./shared/accessibility-i18n.js"></script>
<script src="./shared/qrcode.js"></script>
<script>
  const ICONS = {
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',

    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2c2.5 2.7 2.5 17.3 0 20"/><path d="M12 2c-2.5 2.7-2.5 17.3 0 20"/>',

  function recipientValidationForAsset(asset, recipient) {
    if (isTronRecipient(recipient)) {
      return { valid: false, unsupported: true, message: 'TRON, TRX, and TRC20 are not supported by VelarumPay.' };
    }
    const rules = {
      evm: [/^0x[0-9a-fA-F]{40}$/, 'Enter a full 0x recipient address for this EVM network.'],
      stellar: [/^G[A-Z2-7]{40,64}$/, 'Enter a Stellar public key that starts with G.'],
      solana: [/^[1-9A-HJ-NP-Za-km-z]{32,48}$/, 'Enter a Solana address using base58 characters.'],
      xrp: [/^r[1-9A-HJ-NP-Za-km-z]{12,40}$/, 'Enter an XRP Ledger address that starts with r.'],
      utxo: [/^(bc1|ltc1|bitcoincash:|D|[13L])[A-Za-z0-9:]{18,80}$/, 'Enter a valid UTXO receive address for this network.'],
      move: [/^0x[0-9a-fA-F]{48,80}$/, 'Enter a Move account address beginning with 0x.'],
      ton: [/^[EU]Q[A-Za-z0-9_-]{20,80}$/, 'Enter a TON address beginning with EQ or UQ.'],
      cardano: [/^addr1[0-9a-z]{20,120}$/, 'Enter a Cardano Shelley address beginning with addr1.'],
      cosmos: [/^cosmos1[0-9a-z]{20,80}$/, 'Enter a Cosmos Hub bech32 address beginning with cosmos1.'],
      substrate: [/^[1-9A-HJ-NP-Za-km-z]{35,55}$/, 'Enter a Polkadot SS58 address.'],
      hedera: [/^0\.0\.[0-9]+$/, 'Enter a Hedera account ID such as 0.0.789012.'],
      starknet: [/^0x[0-9a-fA-F]{48,80}$/, 'Enter a Starknet account address beginning with 0x.'],
      algorand: [/^[A-Z2-7]{40,70}$/, 'Enter an Algorand address using uppercase base32 characters.'],
      tezos: [/^tz[1-3][1-9A-HJ-NP-Za-km-z]{20,40}$/, 'Enter a Tezos address beginning with tz1, tz2, or tz3.'],
      icp: [/^[a-z0-9-]{20,90}$/i, 'Enter an ICP account identifier or principal-linked ledger account.'],
      filecoin: [/^f[0-4][a-z0-9]{10,90}$/i, 'Enter a Filecoin address beginning with f1, f2, f3, or f4.']
    };
    const [pattern, message] = rules[asset.family] || rules.evm;
    return { valid: pattern.test(recipient), unsupported: false, message };
  }

      utxo: 'UTXO transfers require coin selection, dust checks and change output review.',
      move: 'Move transfers require gas budget and coin/account validation.',
      ton: 'TON transfers require wallet contract version, seqno and bounceable address review.',
      cardano: 'Cardano transfers require CIP-1852 account, UTXO selection and minimum ADA checks.',
      cosmos: 'Cosmos transfers require account number, sequence, gas and fee denom review.',
      substrate: 'Polkadot transfers require SS58, nonce, era and existential deposit checks.',
      hedera: 'Hedera transfers require account id, memo and tinybar fee review.',
      starknet: 'Starknet transfers require account abstraction readiness, nonce and fee token review.',
      algorand: 'Algorand transfers require suggested params and minimum balance checks.',
      tezos: 'Tezos transfers require branch, counter and possible reveal operation review.',
      icp: 'ICP transfers require ledger account, ingress expiry and fee review.',
      filecoin: 'Filecoin transfers require nonce, gas fee cap, gas premium and message signing.'
    };
    return copy[asset.family] || copy.evm;
  }

  function manualDraftSummary() {
    prepareManualDraftForAsset();
    const draft = state.manualDraft;
    const asset = getAsset(draft.assetKey);
    const recipient = String(draft.recipient || '').trim();
    const amount = parseManualAmount(draft.amount);
    const fee = Number(asset.fee || draft.fee || 0.01);
    const feeSharesToken = asset.feeSymbol === asset.symbol;
    const total = Number.isFinite(amount) && feeSharesToken ? amount + fee : amount;
    const recipientRule = recipientValidationForAsset(asset, recipient);
    const recipientValid = recipientRule.valid;
    const amountValid = Number.isFinite(amount) && amount > 0;
    const available = assetBalanceNumber(asset);
    const balanceValid = amountValid && asset.balance !== 'Not added' && total <= available;
    const memo = String(draft.memo || '').trim();
    const memoValid = !asset.memoRequired || memo.length > 0;
    const valid = recipientValid && amountValid && balanceValid && memoValid && !recipientRule.unsupported;
    const firstIssue = recipientRule.unsupported
      ? recipientRule.message
      : !recipientValid
        ? recipientRule.message
      : !amountValid
        ? 'Enter an amount greater than 0 ' + asset.symbol + '.'
        : !balanceValid
          ? (asset.balance === 'Not added' ? asset.symbol + ' on ' + asset.chain + ' is ready, but this wallet has no spendable balance yet.' : 'Amount exceeds the spendable ' + asset.symbol + ' balance after required fee checks.')
          : !memoValid
            ? (asset.memoLabel || 'Memo') + ' is required for this transfer.'
            : '';
    const amountLabel = formatManualAmount(amount);
    const feeLabel = formatManualAmount(fee);
    const totalLabel = formatManualAmount(total);
    const feeText = feeLabel + ' ' + asset.feeSymbol;
    const totalAuthorization = feeSharesToken
      ? totalLabel + ' ' + asset.symbol
      : amountLabel + ' ' + asset.symbol + ' + ' + feeText;
    return {
      asset,
      token: asset.symbol,
      tokenName: asset.name,
      network: asset.chain,
      family: asset.family,
      standard: asset.standard,
      recipient,
      recipientShort: recipientValid ? shortAddress(recipient) : '0x...',
      amount,
      fee,
      total,
      amountLabel,
      feeLabel,
      totalLabel,
      feeText,
      totalAuthorization,
      feeSharesToken,
      memo,
      memoLabel: asset.memoLabel || 'Memo',
      memoRequired: !!asset.memoRequired,
      memoHelp: asset.memoHelp || 'Optional unless the receiving service asks for it.',
      fiatLabel: Number.isFinite(amount) ? '$' + formatManualAmount(amount) : '$0.00',
      valid,
      recipientValid,
      amountValid,
      balanceValid,
      memoValid,
      unsupported: recipientRule.unsupported,
      firstIssue
    };
  }

  function resetManualExecution() {
    state.manualStatus = 'review';
    state.manualDraft.txHash = '';
  }

  function createManualTxHash() {
    const summary = manualDraftSummary();
    const seedText = [summary.recipient, summary.amountLabel, summary.network, summary.token].join('|');
    let hash = 0x7e4a42bd;
    for (let i = 0; i < seedText.length; i += 1) {
      hash = ((hash << 5) - hash + seedText.charCodeAt(i)) >>> 0;
    }
    const seed = hash.toString(16).padStart(8, '0');
    return '0x' + (seed + '71d856d0b0d47f3c9d0ba9f1d2a6168a5f80f203').repeat(2).slice(0, 64);
  }

  function assetKey(asset) {
    return (asset.symbol + '-' + asset.chain).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function assetAddress(asset) {
    return asset.fullAddress || asset.address;
  }

  function getAsset(id) {
    return assetCatalog.find(asset => assetKey(asset) === id) || assetCatalog[0];
  }

  function visibleAssets() {
    const selected = new Set(state.displayedAssetKeys);
    return assetCatalog.filter(asset => selected.has(assetKey(asset)));
  }

  function activeNetworkCount() {
    return ['base', 'stellar', 'solana', 'polygon', 'baseSepolia'].filter(key => state.prefs[key]).length;

  function screenHasFloatingAction(screen) {
    const stack = Array.from(screen.children).reverse().find(child => child.matches && child.matches('section.stack'));
    const last = stack && stack.lastElementChild;
    return Boolean(last && (
      last.classList.contains('state-actions')
      || last.matches('button.pill.full, button.button.full')
    ));
  }

  function renderNav() {
    const active = ['assetCustomize', 'assetSearch', 'assetDetail', 'assetHistory', 'send', 'receive', 'manualReview', 'scanTransfer'].includes(state.screen) ? 'home' : state.screen === 'detail' || state.screen === 'dossier' ? 'inbox' : ['pairing', 'profile', 'walletIdentity', 'agents', 'agentDetail', 'settings', 'displayLanguage', 'security', 'createWallet', 'keyBackup', 'keyImport', 'deviceRisk', 'networks', 'notifications', 'developer', 'activity'].includes(state.screen) ? 'profile' : state.screen;
    const items = [
      ['home', tx('home'), 'wallet'],
      ['inbox', tx('inbox'), 'zap'],

      const count = id === 'inbox' && pendingCount() > 0 ? '<span class="nav-badge">' + pendingCount() + '</span>' : '';
      return '<button class="nav-item ' + (active === id ? 'active' : '') + '" data-screen="' + id + '">' + count + icon(i, 21) + '<span>' + label + '</span></button>';

    return [

      renderBalance(),
      renderAssets(),

  // Display-only approximate USD unit prices. The wallet has no live price feed,
  // so these are used purely to estimate the headline total from REAL balances.
  // A brand-new (unfunded) wallet has 0 of every asset, so the total reads $0.00.
  function assetUnitUsd(asset) {
    const prices = { USDC: 1, USDT: 1, DAI: 1, XLM: 0.11, SOL: 150, ETH: 2400, BTC: 65000, BNB: 580, POL: 0.45, MATIC: 0.45, AVAX: 28, XRP: 0.5 };
    return prices[asset.symbol] != null ? prices[asset.symbol] : 0;
  }

  function assetFiatUsd(asset) {
    const bal = parseFloat(String(asset.balance).replace(/,/g, ''));
    if (!Number.isFinite(bal)) return 0;
    return bal * assetUnitUsd(asset);
  }

  function totalBalanceUsd() {
    return visibleAssets().reduce((sum, asset) => sum + assetFiatUsd(asset), 0);
  }

  function formatUsd(value) {
    return (Number.isFinite(value) ? value : 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderBalance() {
    const totalUsd = totalBalanceUsd();
    const formatted = formatUsd(totalUsd);
    const subtitle = totalUsd > 0 ? 'Estimated value across your assets' : 'No funds yet · deposit to get started';
    return '<section class="balance-card"><div class="eyebrow on-dark">Total balance</div><div class="balance-value">' + formatted + '<span class="balance-token">USD</span></div><div class="balance-fiat">' + subtitle + '</div><div class="balance-actions"><button class="button white" data-screen="send">' + icon('send', 17) + 'Send</button><button class="button white" data-screen="receive">' + icon('receive', 17) + 'Receive</button></div></section>';

    const key = assetKey(asset);

  }

  function manualFieldHelp(summary) {
    const asset = summary.asset;
    const recipient = summary.recipientValid
      ? summary.network + ' recipient will be shown again before signing.'
      : summary.firstIssue;
    const memo = summary.memoValid
      ? summary.memoHelp
      : (summary.memoLabel + ' is required for this transfer.');
    let amount;
    if (summary.amountValid && summary.balanceValid) {
      amount = 'Network fee ' + summary.feeText + ' · authorize ' + summary.totalAuthorization + ' · ' + summary.fiatLabel;
    } else if (!summary.amountValid) {
      amount = 'Enter the amount to send on ' + summary.network + '.';
    } else {
      amount = asset.balance === 'Not added'
        ? asset.symbol + ' on ' + asset.chain + ' is ready, but this wallet has no spendable balance yet.'
        : 'Amount exceeds the spendable ' + asset.symbol + ' balance after required fee checks.';
    }
    return { recipient: recipient, memo: memo, amount: amount };
  }

  function manualRiskBannerInner(summary) {
    const title = summary.valid ? 'Local approval required' : summary.unsupported ? 'Unsupported network blocked' : 'Review draft fields';
    const body = summary.valid ? chainRequirementCopy(summary.asset) : summary.firstIssue;
    const iconName = summary.valid ? 'shield' : summary.unsupported ? 'alert' : 'info';
    return icon(iconName, 22) + '<div><strong>' + title + '</strong><div style="font-size:var(--text-sm);margin-top:2px">' + body + '</div></div>';
  }

  // Update only the validation-dependent parts of the Send screen in place.
  // Crucially this does NOT re-render the inputs, so focus and the soft keyboard
  // are preserved while the user types (the old full-render-per-keystroke broke
  // typing on Android WebView).
  function updateManualDraftUi() {
    const summary = manualDraftSummary();
    const help = manualFieldHelp(summary);
    const rHelp = document.getElementById('manualRecipientHelp');
    if (rHelp) { rHelp.className = 'field-help ' + (summary.recipientValid ? '' : 'danger'); rHelp.innerHTML = help.recipient; }
    const mHelp = document.getElementById('manualMemoHelp');
    if (mHelp) { mHelp.className = 'field-help ' + (summary.memoValid ? '' : 'danger'); mHelp.innerHTML = help.memo; }
    const aHelp = document.getElementById('manualAmountHelp');
    if (aHelp) { aHelp.className = 'field-help ' + (summary.amountValid && summary.balanceValid ? '' : 'danger'); aHelp.innerHTML = help.amount; }
    const ctx = document.getElementById('manualContextBadge');
    if (ctx) ctx.innerHTML = badge(summary.valid ? 'Ready' : 'Check fields', summary.valid ? 'safe' : summary.unsupported ? 'danger' : 'caution');
    const preview = document.getElementById('manualPreviewCard');
    if (preview) preview.style.display = summary.amountValid ? '' : 'none';
    const risk = document.getElementById('manualRiskBanner');
    if (risk) { risk.className = 'risk ' + (summary.valid ? 'safe' : summary.unsupported ? 'danger' : 'caution'); risk.innerHTML = manualRiskBannerInner(summary); }
    const btn = document.getElementById('manualReviewBtn');
    if (btn) {
      if (summary.valid) { btn.removeAttribute('disabled'); btn.removeAttribute('aria-disabled'); }
      else { btn.setAttribute('disabled', ''); btn.setAttribute('aria-disabled', 'true'); }
    }
  }

n') + '</span></span></div></div></div>',
