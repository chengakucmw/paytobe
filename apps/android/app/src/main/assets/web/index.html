    return meta ? activityRow(meta[0], meta[1], meta[2], meta[3]) : '';
  }

  function activityRow(title, sub, amount, tone) {
    const i = tone === 'danger' ? 'alert' : tone === 'caution' || tone === 'info' ? 'clock' : 'check';
    const style = tone === 'danger'
      ? 'background:var(--red-100);color:var(--red-700)'
      : tone === 'caution'
        ? 'background:var(--amber-100);color:var(--amber-700)'
        : tone === 'info'
          ? 'background:var(--blue-100);color:var(--blue-700)'
          : '';
    return '<div class="switch-row"><span class="switch-icon" style="' + style + '">' + icon(i, 19) + '</span><span style="flex:1;min-width:0"><strong style="display:block;color:var(--text-strong)">' + title + '</strong><span class="subtle" style="font-size:var(--text-sm)">' + sub + '</span></span><span class="mono" style="font-weight:var(--weight-semibold);color:var(--text-strong);white-space:nowrap">' + amount + '</span></div>';
  }

  function renderActionBar() {
    const root = document.getElementById('actionRoot');
    if (state.screen !== 'detail') {
      root.innerHTML = '';
      return;
    }
    const req = getRequest(state.detail);
    const canSign = isRequestSignable(req);
    if (!canSign) {
      root.innerHTML = '';
      return;
    }
    const label = req.risk === 'caution' ? 'Warnings' : req.status === 'blocked' ? 'Blocked' : req.status === 'missing' ? 'Paused' : req.status === 'expired' ? 'Expired' : req.status === 'confirmed' ? 'Signed' : req.status === 'rejected' ? 'Rejected' : 'To sign';
    const signLabel = req.risk === 'caution' ? 'Review' : 'Sign';
    root.innerHTML = '<div class="action-bar ' + (showBottomNav() ? '' : 'no-nav') + '"><div><div class="action-label">' + label + '</div><div class="action-amount">' + req.amount + ' ' + req.token + '</div></div><button class="button secondary" data-action="reject" ' + (canSign ? '' : 'disabled') + '>Reject</button><button class="pill" data-action="confirm-sign" ' + (canSign ? '' : 'disabled') + '>' + signLabel + ' ' + icon('arrowRight', 18) + '</button></div>';
  }

  function signProgress(step) {
    const order = ['review', 'auth', 'done'];
    const labels = ['Review', 'Unlock keyring', 'Signed'];
    const activeIndex = order.indexOf(step);
    return '<div class="sign-progress">' + labels.map((label, index) => '<span class="sign-step ' + (index < activeIndex ? 'done' : index === activeIndex ? 'active' : '') + '">' + label + '</span>').join('') + '</div>';
  }

  function renderModal() {
    const root = document.getElementById('modalRoot');
    if (!state.modal) {
      root.className = 'modal-scrim';
      root.innerHTML = '';
      return;
    }
    const req = getRequest(state.detail);
    root.className = 'modal-scrim show';
    if (state.modal === 'backupRequired') {
      root.innerHTML = '<div class="modal"><div class="eyebrow">Signing locked</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Back up recovery phrase first</h2><p class="subtle">VelarumPay requires a verified 24-word BIP-39 backup before the encrypted keyring can create any local signature.</p><div class="risk caution" style="margin-top:var(--space-4)">' + icon('alert', 21) + '<div><strong>Backup gate is active</strong><div style="font-size:var(--text-sm);margin-top:2px">Receiving and reviewing stay available. Signing, private-key export, and high-risk actions wait until word-order verification is complete.</div></div></div><div class="card sage" style="padding:var(--space-4);margin-top:var(--space-4)">' + fact('Recovery phrase', badge('24-word BIP-39 English', 'caution')) + fact('Backup status', badge('Not verified', 'caution')) + fact('Cloud backup', badge('Off in v1', 'safe')) + '</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="close-modal">Not now</button><button class="pill full" data-screen="keyBackup">Back up now ' + icon('arrowRight', 18) + '</button></div></div>';
      return;
    }
    if (state.modal === 'sign') {
      const step = state.signStep || 'review';
      if (step === 'review') {
        const warning = req.risk === 'caution' ? '<div class="risk caution" style="margin-top:var(--space-4)">' + icon('info', 21) + '<div><strong>Unverified context remains</strong><div style="font-size:var(--text-sm);margin-top:2px">Some claims come from merchant AI, website observation, or your agent inference. Continue only if you accept those limits.</div></div></div>' : '';
        root.innerHTML = '<div class="modal"><div class="eyebrow">Signature flow</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Review before signing</h2><p class="subtle">Confirm the exact on-chain action. Agents can prepare requests, but only this self-custody wallet can sign.</p>' + signProgress('review') + '<div class="card sage" style="padding:var(--space-4)">' + fact('Payee', req.payee) + fact('Recipient', '<span class="address">' + shortAddress(req.recipient) + '</span>') + fact('Network', badge(req.network, 'safe')) + fact('Total', '<span class="mono">' + req.total + ' ' + req.token + '</span>') + fact('Key source', 'Encrypted local keyring') + '</div>' + warning + '<div class="risk safe" style="margin-top:var(--space-4)">' + icon('shield', 21) + '<div><strong>One-time local signature</strong><div style="font-size:var(--text-sm);margin-top:2px">No agent, connector, or VelarumPay server receives seed material or signing permission.</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="close-modal">Cancel</button><button class="pill full" data-action="sign-next">Continue ' + icon('arrowRight', 18) + '</button></div></div>';
      }
      if (step === 'auth') {
        root.innerHTML = '<div class="modal"><div class="eyebrow">Local authentication</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Unlock encrypted keyring</h2>' + signProgress('auth') + '<div class="sign-auth-card"><span class="sign-auth-icon">' + icon('lock', 34) + '</span><strong style="display:block;font-size:var(--text-lg)">Face ID or device passcode</strong><span style="display:block;color:rgba(255,255,255,0.72);font-size:var(--text-sm);margin-top:var(--space-2)">The seed is decrypted only in memory for this signature, then cleared.</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="sign-cancelled">Cancel</button><button class="pill full" data-action="sign-authenticate">Authenticate</button></div><button class="button secondary full" data-action="sign-failed" style="margin-top:var(--space-3)">Simulate authentication failure</button><button class="button secondary full" data-action="sign-timeout" style="margin-top:var(--space-3)">Simulate timeout</button></div>';
      }
      if (step === 'done') {
        root.innerHTML = '<div class="modal"><div class="eyebrow">Signature complete</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Signed locally</h2><p class="subtle">The transaction is ready for broadcast and has been recorded in activity history.</p>' + signProgress('done') + '<div class="signature-receipt"><div class="request-top"><span style="display:flex;align-items:center;gap:var(--space-3);font-weight:var(--weight-semibold)">' + icon('check', 20) + 'Signature created</span>' + badge('Local', 'safe') + '</div><div style="margin-top:var(--space-3)">' + fact('Request ID', '<span class="mono">vp_req_example_0001</span>') + fact('Tx hash', '<span class="address">0x9a86&hellip;61aa</span>') + fact('Amount', '<span class="mono">' + req.amount + ' ' + req.token + '</span>') + '</div></div><button class="pill full" data-action="view-signed-activity" style="margin-top:var(--space-6)">View activity ' + icon('arrowRight', 18) + '</button></div>';
      }
    }
    if (state.modal === 'signingCancelled' || state.modal === 'signingFailed' || state.modal === 'signingTimeout') {
      const outcome = {
        signingCancelled: ['Signing cancelled', 'No signature created', 'You cancelled before local authentication completed. The request is still unsigned.', 'info', 'x'],
        signingFailed: ['Authentication failed', 'Keyring remains locked', 'Device authentication failed. No signature was created and the request status did not change.', 'danger', 'alert'],
        signingTimeout: ['Signing timeout', 'No signature created', 'The authentication window expired before completion. Review again before trying to sign.', 'caution', 'clock']
      }[state.modal];
      root.innerHTML = '<div class="modal"><div class="eyebrow">Signature flow</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">' + outcome[0] + '</h2><p class="subtle">' + outcome[2] + '</p>' + signProgress('auth') + '<div class="risk ' + outcome[3] + '" style="margin-top:var(--space-4)">' + icon(outcome[4], 21) + '<div><strong>' + outcome[1] + '</strong><div style="font-size:var(--text-sm);margin-top:2px">Agents, connectors, and servers still have no signing authority.</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="close-modal">Back to request</button><button class="pill full" data-action="confirm-sign">Review again ' + icon('arrowRight', 18) + '</button></div></div>';
    }
    if (state.modal === 'manualSign') {
      const step = state.signStep || 'review';
      const summary = manualDraftSummary();
      if (step === 'review') {
        root.innerHTML = '<div class="modal"><div class="eyebrow">Manual signature</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Review before signing</h2><p class="subtle">Confirm the exact on-chain transfer before the local keyring is unlocked.</p>' + signProgress('review') + '<div class="card sage" style="padding:var(--space-4)">' + fact('Recipient', '<span class="address">' + summary.recipientShort + '</span>') + (summary.memo ? fact(summary.memoLabel, '<span class="mono">' + escapeHtml(summary.memo) + '</span>') : '') + fact('Network', badge(summary.network, 'safe')) + fact('Amount', '<span class="mono">' + summary.amountLabel + ' ' + summary.token + '</span>') + fact('Fee', '<span class="mono">' + summary.feeText + '</span>') + fact('Total authorization', '<span class="mono">' + summary.totalAuthorization + '</span>') + fact('Key source', 'Encrypted local keyring') + '</div><div class="risk safe" style="margin-top:var(--space-4)">' + icon('shield', 21) + '<div><strong>One-time local signature</strong><div style="font-size:var(--text-sm);margin-top:2px">Only this device can approve the transfer. No agent receives signing permission.</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="close-modal">Cancel</button><button class="pill full" data-action="sign-next">Continue ' + icon('arrowRight', 18) + '</button></div></div>';
      }
      if (step === 'auth') {
        root.innerHTML = '<div class="modal"><div class="eyebrow">Local authentication</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Unlock encrypted keyring</h2>' + signProgress('auth') + '<div class="sign-auth-card"><span class="sign-auth-icon">' + icon('lock', 34) + '</span><strong style="display:block;font-size:var(--text-lg)">Face ID or device passcode</strong><span style="display:block;color:rgba(255,255,255,0.72);font-size:var(--text-sm);margin-top:var(--space-2)">The seed is decrypted only in memory for this signature, then cleared.</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="close-modal">Cancel</button><button class="pill full" data-action="sign-authenticate">Authenticate</button></div></div>';
      }
      if (step === 'done') {
        root.innerHTML = '<div class="modal"><div class="eyebrow">Signature complete</div><h2 class="title" style="font-size:var(--text-xl);margin-top:var(--space-1)">Signed locally</h2><p class="subtle">The signed transfer is ready to broadcast.</p>' + signProgress('done') + '<div class="signature-receipt"><div class="request-top"><span style="display:flex;align-items:center;gap:var(--space-3);font-weight:var(--weight-semibold)">' + icon('check', 20) + 'Signature created</span>' + badge('Local', 'safe') + '</div><div style="margin-top:var(--space-3)">' + fact('Recipient', '<span class="address">' + summary.recipientShort + '</span>') + fact('Total authorization', '<span class="mono">' + summary.totalAuthorization + '</span>') + '</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)"><button class="button secondary full" data-action="manual-signed-done">Review</button><button class="pill full" data-action="manual-broadcast">Broadcast ' + icon('arrowRight', 18) + '</button></div></div>';
      }
    }
  }

  function openBackupRequired(message) {
    state.signStep = 'review';
    state.modal = 'backupRequired';
    renderModal();
    showToast('Backup required', message || 'Verify the 24-word recovery phrase before signing.', true);
  }

  function showToast(title, msg, failed) {
    state.toast = { title, msg, failed };
    renderToast();
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      state.toast = null;
      renderToast();
    }, 2600);
  }

  function renderToast() {
    const root = document.getElementById('toast');
    if (!state.toast) {
      root.className = 'toast';
      root.innerHTML = '';
      return;
    }
    root.className = 'toast show' + (state.toast.failed ? ' failed' : '');
    root.innerHTML = '<span style="color:' + (state.toast.failed ? 'var(--red-700)' : 'var(--green-700)') + '">' + icon(state.toast.failed ? 'x' : 'check', 20) + '</span><span><strong style="display:block;color:var(--text-strong)">' + state.toast.title + '</strong><span class="subtle" style="font-size:var(--text-sm)">' + state.toast.msg + '</span></span>';
  }

  function pasteRecipientFromClipboard() {
    function apply(text) {
      const value = String(text || '').trim();
      if (!value) {
        showToast('Clipboard empty', 'Copy a recipient address first, then tap paste.', true);
        return;
      }
      state.manualDraft.recipient = value;
      resetManualExecution();
      render();
      showToast('Recipient pasted', 'Pasted address from clipboard. Review it before signing.');
    }
    // Prefer the native bridge (reliable inside the Android WebView), then fall
    // back to the Web Clipboard API for browser preview.
    if (window.VPNative && typeof window.VPNative.readClipboard === 'function') {
      let native = '';
      try { native = window.VPNative.readClipboard(); } catch (e) { native = ''; }
      apply(native);
      return;
    }
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(apply).catch(() => {
        showToast('Paste unavailable', 'Could not read the clipboard. Type the address instead.', true);
      });
      return;
    }
    showToast('Paste unavailable', 'Clipboard access is not available here.', true);
  }

  function requestNativeScan() {
    if (window.VelarumPayNativeScan && typeof window.VelarumPayNativeScan.startScan === 'function') {
      window.VelarumPayNativeScan.startScan(state.scanMode);
      showToast('Opening camera', 'Point the camera at a supported QR code.');
      return;
    }
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.velarumPayScan) {
      window.webkit.messageHandlers.velarumPayScan.postMessage({ mode: state.scanMode });
      showToast('Opening camera', 'Point the camera at a supported QR code.');
      return;
    }
    showToast('Camera bridge unavailable', 'Use the sample QR buttons in this browser preview.', true);
  }

  window.VelarumPrototypeScanResult = value => {
    handleScannedQrPayload(value);
  };

  window.VelarumPrototypeBack = () => {
    return goBackToParent();
  };

  document.addEventListener('input', event => {
    const manualTarget = event.target.closest('[data-manual-field]');
    if (manualTarget) {
      const field = manualTarget.getAttribute('data-manual-field');
      state.manualDraft[field] = manualTarget.value;
      resetManualExecution();
      updateManualDraftUi();
      return;
    }

    const networkTarget = event.target.closest('[data-network-field]');
    if (networkTarget) {
      const field = networkTarget.getAttribute('data-network-field');
      const cursor = networkTarget.selectionStart;
      state.networkDraft[field] = field === 'symbol' ? networkTarget.value.toUpperCase() : networkTarget.value;
      state.rpcChecked = false;
      if (state.networkMode === 'verified') state.networkMode = 'add';
      render();
      const nextInput = document.getElementById(networkTarget.id);
      if (nextInput) {
        nextInput.focus();
        if (typeof cursor === 'number') {
          nextInput.setSelectionRange(cursor, cursor);
        }
      }
      return;
    }

    if (event.target.id !== 'assetSearchInput') return;
    state.assetQuery = event.target.value;
    const results = document.getElementById('assetSearchResults');
    if (results) results.innerHTML = renderAssetSearchResults();
  });

  document.addEventListener('click', event => {
    const backTarget = event.target.closest('[data-back]');
    if (backTarget) {
      goBackToParent();
      return;
    }

    const screenTarget = event.target.closest('[data-screen]');
    if (screenTarget) {
      const nextScreen = screenTarget.getAttribute('data-screen');
      setScreen(nextScreen);
      return;
    }

    const detailTarget = event.target.closest('[data-detail]');
    if (detailTarget) {
      setScreen('detail', detailTarget.getAttribute('data-detail'));
      return;
    }

    const assetTarget = event.target.closest('[data-asset]');
    if (assetTarget) {
      state.asset = assetTarget.getAttribute('data-asset');
      setScreen('assetDetail');
      return;
    }

    const assetHistoryTarget = event.target.closest('[data-asset-history]');
    if (assetHistoryTarget) {
      setScreen('assetHistory');
      return;
    }

    const agentTarget = event.target.closest('[data-agent]');
    if (agentTarget) {
      state.agent = agentTarget.getAttribute('data-agent');
      setScreen('agentDetail');
      return;
    }

    const avatarChoiceTarget = event.target.closest('[data-avatar-choice]');
    if (avatarChoiceTarget) {
      state.avatarInitial = avatarChoiceTarget.getAttribute('data-avatar-choice');
      render();
      return;
    }

    const filterTarget = event.target.closest('[data-filter]');
    if (filterTarget) {
      state.filter = filterTarget.getAttribute('data-filter');
      render();
      return;
    }

    const scopeTarget = event.target.closest('[data-scope]');
    if (scopeTarget && !scopeTarget.disabled) {
      const key = scopeTarget.getAttribute('data-scope');
      state.scopes[key] = !state.scopes[key];
      render();
      return;
    }

    const prefTarget = event.target.closest('[data-pref]');
    if (prefTarget && !prefTarget.disabled) {
      const key = prefTarget.getAttribute('data-pref');
      state.prefs[key] = !state.prefs[key];
      render();
      return;
    }

    const assetToggleTarget = event.target.closest('[data-asset-toggle]');
    if (assetToggleTarget && !assetToggleTarget.disabled) {
      const key = assetToggleTarget.getAttribute('data-asset-toggle');
      const shown = state.displayedAssetKeys.includes(key);
      if (shown && state.displayedAssetKeys.length <= 1) {
        showToast('Keep one asset visible', 'Home needs at least one crypto asset row.');
        return;
      }
      state.displayedAssetKeys = shown
        ? state.displayedAssetKeys.filter(item => item !== key)
        : state.displayedAssetKeys.concat(key);
      render();
      showToast(shown ? 'Asset hidden' : 'Asset added', shown ? 'Home list updated.' : 'Asset is now visible on Home.');
      return;
    }

    const searchQueryTarget = event.target.closest('[data-search-query]');
    if (searchQueryTarget) {
      state.assetQuery = searchQueryTarget.getAttribute('data-search-query');
      const input = document.getElementById('assetSearchInput');
      const results = document.getElementById('assetSearchResults');
      if (input) input.value = state.assetQuery;
      if (results) results.innerHTML = renderAssetSearchResults();
      return;
    }

    const clearSearchTarget = event.target.closest('[data-clear-search]');
    if (clearSearchTarget) {
      state.assetQuery = '';
      const input = document.getElementById('assetSearchInput');
      const results = document.getElementById('assetSearchResults');
      if (input) {
        input.value = '';
        input.focus();
      }
      if (results) results.innerHTML = renderAssetSearchResults();
      return;
    }

    const scanModeTarget = event.target.closest('[data-scan-mode]');
    if (scanModeTarget) {
      state.scanMode = scanModeTarget.getAttribute('data-scan-mode');
      render();
      return;
    }

    const actionTarget = event.target.closest('[data-action]');
    if (!actionTarget) return;
    const action = actionTarget.getAttribute('data-action');
    if (action === 'noop') {
      showToast('Not available yet', 'This option is not part of this build.');
    }
    if (action === 'draft-transfer') {
      const summary = manualDraftSummary();
      if (!summary.valid) {
        showToast('Draft needs review', summary.firstIssue, true);
        render();
        return;
      }
      state.manualStatus = 'review';
      setScreen('manualReview');
    }
    if (action === 'manual-sign') {
      const summary = manualDraftSummary();
      if (!summary.valid) {
        setScreen('send');
        showToast('Draft needs review', summary.firstIssue, true);
        return;
      }
      if (!state.backupSaved) {
        openBackupRequired('Verify the 24-word recovery phrase before signing this manual transfer.');
        return;
      }
      state.signStep = 'review';
      state.modal = 'manualSign';
      renderModal();
    }
    if (action === 'manual-broadcast') {
      state.modal = null;
      state.signStep = 'review';
      state.manualDraft.txHash = state.manualDraft.txHash || createManualTxHash();
      state.manualStatus = 'broadcasting';
      render();
      showToast('Broadcasting', 'Transaction hash submitted to the network.');
    }
    if (action === 'manual-confirm') {
      state.manualDraft.txHash = state.manualDraft.txHash || createManualTxHash();
      state.manualStatus = 'confirmed';
      render();
      showToast('Confirmed', 'Manual transfer confirmed and added to activity history.');
    }
    if (action === 'manual-fail') {
      state.manualDraft.txHash = state.manualDraft.txHash || createManualTxHash();
      state.manualStatus = 'failed';
      render();
      showToast('Broadcast failed', 'No balance change was recorded.', true);
    }
    if (action === 'manual-reset') {
      resetManualExecution();
      setScreen('send');
      showToast('Draft restored', 'Review the token, recipient, and fee again before signing.');
    }
    if (action === 'manual-signed-done') {
      state.modal = null;
      state.signStep = 'review';
      setScreen('manualReview');
    }
    if (action === 'paste-manual-recipient') {
      pasteRecipientFromClipboard();
    }
    if (action === 'home-scan') {
      if ((window.VelarumPayNativeScan && typeof window.VelarumPayNativeScan.startScan === 'function') || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.velarumPayScan)) {
        requestNativeScan();
      } else {
        state.scanTransferStatus = 'scan';
        setScreen('scanTransfer');
      }
    }
    if (action === 'scan-open-camera') {
      requestNativeScan();
    }
    if (action === 'scan-sign') {
      if (!state.backupSaved) {
        openBackupRequired('Verify the 24-word recovery phrase before signing this QR payment.');
        return;
      }
      state.scanTransferStatus = 'signed';
      render();
      showToast('Signed locally', 'Scanned payment was signed on this device.');
    }
    if (action === 'scan-broadcast') {
      state.scanTransferStatus = 'broadcasting';
      render();
      showToast('Broadcasting', 'Scanned payment submitted to the network.');
    }
    if (action === 'scan-confirm') {
      state.scanTransferStatus = 'confirmed';
      render();
      showToast('Transfer confirmed', 'Scanned payment appears in activity history.');
    }
    if (action === 'scan-fail') {
      state.scanTransferStatus = 'failed';
      render();
      showToast('Broadcast failed', 'No balance change was recorded.', true);
    }
    if (action === 'scan-reset') {
      resetScanTransfer();
      setScreen('scanTransfer');
      showToast('Scanner ready', 'Scan another payment QR.');
    }
    if (action === 'scan-cancel') {
      resetScanTransfer();
      setScreen('home');
      showToast('Transfer cancelled', 'Nothing was signed.', true);
    }
    if (action === 'scan-save-setup') {
      state.scanTransferStatus = 'scan';
      setScreen('profile');
      showToast('Setup saved', 'Relay setup accepted in the prototype.');
    }
    if (action === 'copy-address') {
      const asset = selectedTransferAsset();
      showToast('Address copied', asset.chain + ' receive address copied for this wallet.');
    }
    if (action === 'export-recovery') {
      showToast('Recovery checked', 'No recovery export was created in this prototype.');
    }
    if (action === 'reveal-backup') {
      state.backupRevealed = true;
      state.keyBackupStep = 'revealed';
      render();
      showToast('Recovery phrase revealed', 'Keep these words offline. Anyone with them can control this wallet.');
    }
    if (action === 'hide-backup') {
      state.backupRevealed = false;
      state.keyBackupStep = 'hidden';
      render();
      showToast('Recovery phrase hidden', 'Plaintext is no longer visible.');
    }
    if (action === 'verify-backup') {
      state.backupRevealed = false;
      state.keyBackupStep = 'verify';
      render();
      showToast('Verification started', 'Confirm sampled words from the offline backup.');
    }
    if (action === 'confirm-backup') {
      state.backupSaved = true;
      state.backupRevealed = false;
      state.keyBackupStep = 'verified';
      render();
      showToast('Backup verified', 'Word-order recovery check marked complete on this device.');
    }
    if (action === 'review-device-risk') {
      state.deviceRiskReviewed = true;
      state.deviceRiskMode = 'normal';
      render();
      showToast('Device risk reviewed', 'Sensitive actions stay gated by local authentication and risk signals.');
    }
    if (action === 'device-risk-restricted') {
      state.deviceRiskMode = 'restricted';
      render();
      showToast('Restricted mode', 'Secret reveal and export controls are blocked.', true);
    }
    if (action === 'device-risk-normal') {
      state.deviceRiskMode = 'normal';
      render();
      showToast('Normal mode', 'Runtime checks returned to the no-signal sample.');
    }
    if (action === 'validate-import') {
      state.importPreview = true;
      state.keyImportMode = 'preview';
      render();
      showToast('Validated locally', 'Wallet preview derived without a network request.');
    }
    if (action === 'key-import-invalid') {
      state.importPreview = false;
      state.keyImportMode = 'invalid';
      render();
      showToast('Validation failed', 'No network request was made.', true);
    }
    if (action === 'key-import-private') {
      state.importPreview = false;
      state.keyImportMode = 'privateKey';
      render();
    }
    if (action === 'key-import-selector') {
      state.importPreview = false;
      state.keyImportMode = 'selector';
      render();
    }
    if (action === 'key-import-cancel') {
      state.importPreview = false;
      state.keyImportMode = 'selector';
      setScreen('security');
    }
    if (action === 'import-wallet') {
      state.walletImported = true;
      state.importPreview = false;
      state.keyImportMode = 'success';
      render();
      showToast('Wallet imported', 'Imported wallet added to this device.');
    }
    if (action === 'test-rpc') {
      if (!networkDraftComplete()) {
        state.rpcChecked = false;
        state.networkMode = 'add';
        render();
        showToast('Network details required', 'Fill network name, RPC URL, Chain ID, and currency symbol before testing RPC.', true);
        return;
      }
      state.rpcChecked = true;
      state.networkMode = 'verified';
      render();
      showToast('RPC reachable', 'Chain ID ' + state.networkDraft.chainId + ' matched the RPC endpoint.');
    }
    if (action === 'network-add-flow') {
      clearNetworkDraft();
      state.networkMode = 'add';
      render();
    }
    if (action === 'open-network-warning') {
      state.networkMode = 'warning';
      setScreen('networks');
    }
    if (action === 'prefill-request-network') {
      prefillNetworkDraftFromRequest();
      state.networkMode = 'add';
      render();
    }
    if (action === 'back-to-network-request') {
      state.networkMode = 'list';
      setScreen('detail', 'networkDisabled');
    }
    if (action === 'network-list') {
      state.networkMode = 'list';
      setScreen('networks');
    }
    if (action === 'add-custom-network') {
      if (!state.rpcChecked || !networkDraftComplete()) {
        state.networkMode = 'add';
        render();
        showToast('Verify first', 'Test RPC and match Chain ID before adding the network.', true);
        return;
      }
      state.rpcChecked = true;
      state.customNetworkAdded = true;
      state.prefs.baseSepolia = true;
      state.networkMode = 'added';
      render();
      showToast('Network added', (state.networkDraft.networkName || 'Custom network') + ' is now available for receive addresses and request review.');
    }
    if (action === 'request-context') {
      showToast('Context requested', 'The agent must attach evidence before signing can resume.');
    }
    if (action === 'refresh-status') {
      state.requestOverrides[state.detail] = 'confirmed';
      render();
      showToast('Confirmed', 'Network confirmation received for this transaction.');
    }
    if (action === 'retry-broadcast') {
      state.requestOverrides[state.detail] = 'broadcasting';
      render();
      showToast('Retry submitted', 'Broadcast retry is waiting for network confirmation.');
    }
    if (action === 'replace-request') {
      showToast('Replacement required', 'Prototype marks this as a new Payment Request flow.');
    }
    if (action === 'archive-request') {
      setScreen('inbox');
      showToast('Archived', 'Final request moved out of active review.');
    }
    if (action === 'edit-nickname') {
      state.walletIdentityMode = 'nickname';
      render();
    }
    if (action === 'edit-wallet-id') {
      state.walletIdentityMode = 'walletId';
      render();
    }
    if (action === 'edit-avatar') {
      state.walletIdentityMode = 'avatar';
      render();
    }
    if (action === 'cancel-profile-edit') {
      state.walletIdentityMode = 'overview';
      render();
    }
    if (action === 'save-profile') {
      if (state.walletIdentityMode === 'nickname') {
        state.walletName = state.walletName || 'My Wallet';
        state.avatarInitial = state.walletName.slice(0, 1);
      }
      if (state.walletIdentityMode === 'walletId') {
        state.walletId = state.walletId || '';
      }
      state.walletIdentityMode = 'saved';
      render();
      showToast('Profile updated', 'Public wallet profile changed without touching keys.');
    }
    if (action === 'confirm-sign') {
      if (!state.backupSaved) {
        openBackupRequired('Verify the 24-word recovery phrase before signing this request.');
        return;
      }
      state.signStep = 'review';
      state.modal = 'sign';
      renderModal();
    }
    if (action === 'close-modal') {
      state.modal = null;
      state.signStep = 'review';
      renderModal();
    }
    if (action === 'sign-next') {
      if (!state.backupSaved) {
        openBackupRequired('Verify the 24-word recovery phrase before unlocking the keyring.');
        return;
      }
      state.signStep = 'auth';
      renderModal();
    }
    if (action === 'sign-cancelled') {
      state.signStep = 'review';
      state.modal = 'signingCancelled';
      renderModal();
    }
    if (action === 'sign-failed') {
      state.signStep = 'review';
      state.modal = 'signingFailed';
      renderModal();
    }
    if (action === 'sign-timeout') {
      state.signStep = 'review';
      state.modal = 'signingTimeout';
      renderModal();
    }
    if (action === 'sign-authenticate') {
      if (!state.backupSaved) {
        openBackupRequired('Verify the 24-word recovery phrase before local authentication can sign.');
        return;
      }
      if (state.modal === 'manualSign') {
        state.manualStatus = 'signed';
        state.signStep = 'done';
        render();
        showToast('Signed locally', 'Encrypted keyring unlocked locally and the signed transfer is ready to broadcast.');
        return;
      }
      state.signed = true;
      state.rejected = false;
      state.requestOverrides[state.detail] = 'confirmed';
      state.signStep = 'done';
      render();
      showToast('Signed locally', 'Encrypted keyring unlocked locally and the signature was created on this device.');
    }
    if (action === 'view-signed-activity') {
      state.modal = null;
      state.signStep = 'review';
      setScreen('activity');
      showToast('Activity updated', 'Signed request moved into history.');
    }
    if (action === 'reject') {
      state.requestOverrides[state.detail] = 'rejected';
      if (state.detail === 'agentfood') {
        state.rejected = true;
        state.signed = false;
      }
      setScreen('inbox');
      showToast('Request rejected', 'Nothing was signed.', true);
    }
    if (action === 'approve-pairing') {
      state.paired = true;
      if (state.screen === 'pairing') {
        state.pairingMode = 'approved';
        render();
      } else {
        setScreen('agents');
      }
      showToast('Agent connected', 'Signing still requires you.');
    }
    if (action === 'reject-pairing') {
      state.paired = false;
      if (state.screen === 'pairing') {
        state.pairingMode = 'rejected';
        render();
      } else {
        setScreen('agents');
      }
      showToast('Pairing rejected', 'No permissions were granted.', true);
    }
    if (action === 'pairing-request') {
      state.pairingMode = 'request';
      render();
    }
    if (action === 'pairing-scan') {
      state.pairingMode = 'scan';
      render();
    }
    if (action === 'revoke-all') {
      state.paired = false;
      setScreen('agents');
      showToast('Connection revoked', 'This agent can no longer create requests.', true);
    }
  });

  document.addEventListener('velarum:prototype-prefs-changed', () => render());
  if (window.VelarumPrototypePrefs) window.VelarumPrototypePrefs.init({ panel: false });
  updateStatusTime();
  window.setInterval(updateStatusTime, 30000);
  render();
</script>
<script src="./app-bridge.js"></script>
</body>
</html>
