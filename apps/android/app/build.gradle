plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def firebaseConfigValue = { String propertyName, String environmentName ->
    def propertyValue = project.findProperty(propertyName)
    propertyValue != null ? propertyValue.toString() : (System.getenv(environmentName) ?: "")
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def buildConfigBoolean = { String value ->
    ["1", "true", "yes", "on"].contains(value.trim().toLowerCase()) ? "true" : "false"
}
def generatedThirdPartyAssets = layout.buildDirectory.dir("generated/third-party-assets")
def generateThirdPartyLicenseAssets = tasks.register("generateThirdPartyLicenseAssets", Copy) {
    from(rootProject.file("../../LICENSE")) {
        rename { "LICENSE.txt" }
    }
    from(rootProject.file("../../NOTICE")) {
        rename { "NOTICE.txt" }
    }
    into(generatedThirdPartyAssets.map { it.dir("third_party") })
}

// Release signing values may come from an ignored local properties file or
// from the build environment. Official release builds never fall back to the
// Android debug key.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)
    environmentValue != null && !environmentValue.trim().isEmpty()
        ? environmentValue
        : (keystoreProperties[propertyName] ?: "").toString()
}
def releaseStorePath = releaseSigningValue("storeFile", "VELARUMPAY_ANDROID_KEYSTORE_PATH")
def releaseStorePassword = releaseSigningValue("storePassword", "VELARUMPAY_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = releaseSigningValue("keyAlias", "VELARUMPAY_ANDROID_KEY_ALIAS")
def releaseKeyPassword = releaseSigningValue("keyPassword", "VELARUMPAY_ANDROID_KEY_PASSWORD")
def hasReleaseKeystore = !releaseStorePath.isEmpty()
    && file(releaseStorePath).exists()
    && !releaseStorePassword.isEmpty()
    && !releaseKeyAlias.isEmpty()
    && !releaseKeyPassword.isEmpty()

android {
    namespace "ai.agentwallet.hd"
    compileSdk 35

    defaultConfig {
        applicationId "com.velarumpay.wallet"
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName "0.2.3-velarumpay"
        resourceConfigurations += ["en"]
        buildConfigField "String", "FIREBASE_APPLICATION_ID", buildConfigString(firebaseConfigValue("velarumpay.firebase.applicationId", "VELARUMPAY_FIREBASE_APPLICATION_ID"))
        buildConfigField "String", "FIREBASE_API_KEY", buildConfigString(firebaseConfigValue("velarumpay.firebase.apiKey", "VELARUMPAY_FIREBASE_API_KEY"))
        buildConfigField "String", "FIREBASE_PROJECT_ID", buildConfigString(firebaseConfigValue("velarumpay.firebase.projectId", "VELARUMPAY_FIREBASE_PROJECT_ID"))
        buildConfigField "String", "FIREBASE_SENDER_ID", buildConfigString(firebaseConfigValue("velarumpay.firebase.senderId", "VELARUMPAY_FIREBASE_SENDER_ID"))
        buildConfigField "boolean", "STELLAR_MAINNET_ENABLED", buildConfigBoolean(firebaseConfigValue("velarumpay.stellar.mainnetEnabled", "VELARUMPAY_STELLAR_MAINNET_ENABLED"))
        buildConfigField "String", "STELLAR_MAINNET_MAX_XLM", buildConfigString(firebaseConfigValue("velarumpay.stellar.mainnetMaxXlm", "VELARUMPAY_STELLAR_MAINNET_MAX_XLM") ?: "1")
        buildConfigField "String", "STELLAR_MAINNET_HORIZON_URL", buildConfigString(firebaseConfigValue("velarumpay.stellar.mainnetHorizonUrl", "VELARUMPAY_STELLAR_MAINNET_HORIZON_URL") ?: "https://horizon.stellar.org")
        buildConfigField "String", "STELLAR_MAINNET_RECIPIENTS", buildConfigString(firebaseConfigValue("velarumpay.stellar.mainnetRecipients", "VELARUMPAY_STELLAR_MAINNET_RECIPIENTS"))
        buildConfigField "String", "DEFAULT_PLATFORM_API_URL", '"https://api.velarumai.com"'
        buildConfigField "boolean", "MANAGED_PLATFORM_SERVICE", "true"
        buildConfigField "boolean", "PLATFORM_WEBSOCKET_ENABLED", "false"
        buildConfigField "boolean", "INTERNAL_PLATFORM_OVERRIDE_ENABLED", "false"
        buildConfigField "boolean", "OFFICIAL_TESTNET_ONLY", "true"
    }

    flavorDimensions += "network"
    productFlavors {
        standard {
            dimension "network"
            buildConfigField "boolean", "TESTNET_ONLY", "true"
            manifestPlaceholders = [appLabel: "VelarumPay"]
        }
        stellarTestnet {
            dimension "network"
            applicationIdSuffix ".testnet"
            versionCode 30
            versionNameSuffix "-testnet"
            buildConfigField "boolean", "TESTNET_ONLY", "true"
            manifestPlaceholders = [appLabel: "VelarumPay Testnet"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // --- VelarumPay shared Rust wallet core (stable C ABI) ---
    // WalletCoreBridge calls the native library through JNA. On device the core ships as
    // src/main/jniLibs/*/libvelarum_wallet_core.so (built by build-android.sh);
    // JVM unit tests load the host build via jna.library.path below.
    testOptions {
        // Return defaults (not "not mocked" exceptions) for android.* stubs in plain JVM
        // unit tests, so VpLog breadcrumbs (which call android.util.Log) inside catch
        // blocks don't blow up pure-logic parser/expiry tests. Production logging on a real
        // device is unaffected; this only changes the unit-test JVM stub behaviour.
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty "jna.library.path", "${rootDir}/../../crates/velarum-wallet-core/target/release"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir(generatedThirdPartyAssets)
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // --- 出厂打包模式（性能关键）-------------------------------------------------
    // 此前没有 release 配置 → 平时点 Run 装的是 debug「草稿版」，Compose 在 debug 下
    // 关闭了大量优化、还带调试插桩，体感会比 release「正式版」慢数倍。这正是「换原生后
    // 反而觉得卡」的头号原因。release 打开 R8（代码优化），配合 Baseline Profile 后，
    // 流畅度通常明显反超旧 WebView。proguard-rules.pro 里已对 JNA/web3j/bitcoinj/
    // BouncyCastle 等反射/原生库写了 keep 规则，避免 R8 误删导致 release 崩溃。
    buildTypes {
        release {
            minifyEnabled true            // 开启 R8：去无用代码 + 优化（性能/体积的主力）
            shrinkResources false         // 资源压缩先关，确保安全；真机验证 release 无误后可改 true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 草稿版保持不混淆、构建快，方便日常开发调试（慢是正常的，别据此评判性能）。
            minifyEnabled false
        }
        internalDebug {
            initWith debug
            matchingFallbacks = ["debug"]
            applicationIdSuffix ".internal"
            versionNameSuffix "-internal"
            buildConfigField "boolean", "MANAGED_PLATFORM_SERVICE", "false"
            buildConfigField "boolean", "PLATFORM_WEBSOCKET_ENABLED", "true"
            buildConfigField "boolean", "INTERNAL_PLATFORM_OVERRIDE_ENABLED", "true"
            manifestPlaceholders = [appLabel: "VelarumPay Internal · Unofficial"]
        }
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/INDEX.LIST",
                    "META-INF/io.netty.versions.properties",
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/DISCLAIMER",
                    "META-INF/FastDoubleParser-LICENSE",
                    "META-INF/FastDoubleParser-NOTICE",
                    "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
                    "META-INF/*.kotlin_module"
            ]
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "VelarumPay-${variant.name}.apk"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedReleaseArtifact = graph.allTasks.any { task ->
        task.name ==~ /(?i)(assemble|bundle).*Release/
    }
    if (requestedReleaseArtifact && !hasReleaseKeystore) {
        throw new GradleException(
            "Release signing is not configured. Provide the VELARUMPAY_ANDROID_* signing environment variables or apps/android/keystore.properties."
        )
    }
}

tasks.named("preBuild").configure {
    dependsOn(generateThirdPartyLicenseAssets)
}

dependencies {
    // Owner-approved Rule 0 exception: FCM 25.1.1 and its reviewed, locked
    // Google Play Services runtime graph. Do not upgrade without a new review.
    implementation "com.google.firebase:firebase-messaging:25.1.1"
    constraints {
        implementation("com.google.android.gms:play-services-base:18.9.0") { version { strictly("18.9.0") } }
        implementation("com.google.android.gms:play-services-basement:18.9.0") { version { strictly("18.9.0") } }
        implementation("com.google.android.gms:play-services-tasks:18.4.0") { version { strictly("18.4.0") } }
        implementation("com.google.android.gms:play-services-cloud-messaging:17.4.0") { version { strictly("17.4.0") } }
        implementation("com.google.android.gms:play-services-stats:17.0.2") { version { strictly("17.0.2") } }
    }
    // Apache-2.0. FCM callbacks only enqueue bounded authenticated REST sync;
    // WorkManager owns retries when Android gives the callback a short lifetime.
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.biometric:biometric:1.1.0"
    // Apache-2.0. Biometric 1.1.0 otherwise pins Fragment 1.2.5, which is
    // incompatible with the Activity Result APIs used by Activity 1.9.3.
    implementation "androidx.fragment:fragment:1.8.9"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.zxing:core:3.5.3"
    implementation("org.bitcoinj:bitcoinj-core:0.16.3") {
        exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
    }
    implementation "org.web3j:core:4.12.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // --- Jetpack Compose（UI 原生重写，Phase 0 接入）---
    // BOM 统一管理 Compose 各库版本；2025.01.01 与 compileSdk 35 兼容，不强制升 36。
    def composeBom = platform("androidx.compose:compose-bom:2025.01.01")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // --- Baseline Profile（提速地图）安装器 ----------------------------------------
    // 让 App 自带的 src/main/baseline-prof.txt 在安装时把高频路径提前编译（AOT），
    // 头几次启动/滚动就直接顺滑，而不是「用着用着才变快」。也为日后 Play 云端 Profile 铺路。
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
    implementation "net.java.dev.jna:jna:5.14.0@aar"   // Android jnidispatch (device)
    testImplementation "net.java.dev.jna:jna:5.14.0"   // host jnidispatch (JVM unit tests)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

// --- VelarumPay shared Rust wallet-core (stable C ABI) build wiring -----------
// The host library supports JVM conformance tests. Device libraries are rebuilt
// for every Android ABI and checked for the complete version-1 symbol surface.

ext.wcCrateDir = file("${rootDir}/../../crates/velarum-wallet-core")
ext.wcJniLibs  = file("${projectDir}/src/main/jniLibs")
ext.wcAbis     = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

def wcHasExe = { String exe ->
    (System.getenv("PATH") ?: "").split(File.pathSeparator).any { new File(it, exe).canExecute() }
}

// Host library for JVM unit tests. No NDK is needed.
tasks.register("buildWalletCoreHostLibrary", Exec) {
    workingDir rootDir
    commandLine "bash", "${wcCrateDir}/scripts/build-android-host.sh"
    inputs.dir("${wcCrateDir}/src")
    inputs.file("${wcCrateDir}/Cargo.toml")
    outputs.dir("${wcCrateDir}/target/release")
    onlyIf {
        if (wcHasExe("cargo")) return true
        throw new GradleException("wallet-core: 'cargo' is required to build the host C ABI library. Install Rust: https://rustup.rs")
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn "buildWalletCoreHostLibrary" }

// Device .so for every ABI (needs NDK + cargo-ndk).
tasks.register("buildWalletCoreDeviceLibs", Exec) {
    dependsOn "buildWalletCoreHostLibrary"
    workingDir rootDir
    commandLine "bash", "${wcCrateDir}/scripts/build-android.sh"
    inputs.dir("${wcCrateDir}/src")
    inputs.file("${wcCrateDir}/Cargo.toml")
    wcAbis.each { abi -> outputs.file("${wcJniLibs}/${abi}/libvelarum_wallet_core.so") }
    onlyIf {
        def ok = wcHasExe("cargo") && wcHasExe("cargo-ndk")
        if (!ok) logger.warn("wallet-core: cargo/cargo-ndk not on PATH — skipping device .so rebuild. " +
            "The verify step will FAIL the build if the bundled .so is stale. " +
            "Refresh manually: crates/velarum-wallet-core/scripts/build-android.sh")
        ok
    }
}

// Safety gate: all stable C ABI v1 symbols must exist in the packaged library.
tasks.register("verifyWalletCoreNativeLibs") {
    dependsOn "buildWalletCoreDeviceLibs"
    doLast {
        def so = new File("${wcJniLibs}/arm64-v8a/libvelarum_wallet_core.so")   // real-device ABI
        if (!so.exists()) so = wcAbis.collect { new File("${wcJniLibs}/${it}/libvelarum_wallet_core.so") }.find { it.exists() }
        if (so == null)
            throw new GradleException("wallet-core: no libvelarum_wallet_core.so in src/main/jniLibs. " +
                "Build it (needs Android NDK + cargo-ndk): crates/velarum-wallet-core/scripts/build-android.sh")
        def referenced = [
            "velarum_wallet_core_abi_version",
            "velarum_wallet_core_call",
            "velarum_wallet_core_result_data",
            "velarum_wallet_core_result_len",
            "velarum_wallet_core_result_free",
        ]
        def haystack = new String(so.bytes, "ISO-8859-1")
        def missing = referenced.findAll { !haystack.contains(it) }
        if (!missing.isEmpty())
            throw new GradleException("wallet-core: ${so.parentFile.name}/${so.name} is OUT OF SYNC with the " +
                "stable C ABI — missing ${missing.size()} symbol(s), e.g.:\n  " + missing.take(6).join("\n  ") +
                "\nThe app would crash at runtime with 'undefined symbol'. Rebuild the native libs:\n" +
                "  crates/velarum-wallet-core/scripts/build-android.sh")
        logger.lifecycle("wallet-core: verified ${referenced.size()} stable C ABI symbols present in ${so.parentFile.name}/${so.name} ✓")
    }
}

// Rebuild + verify the native libs before they are merged into the APK/bundle.
tasks.matching { it.name ==~ /merge.*(NativeLibs|JniLibFolders)/ }.configureEach {
    dependsOn "verifyWalletCoreNativeLibs"
}
